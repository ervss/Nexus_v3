<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexus Annotator — schránka</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #090b12;
        color: #f7f7fb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 0%, rgba(255, 42, 155, .16), transparent 36%),
          radial-gradient(circle at 100% 100%, rgba(80, 200, 255, .12), transparent 42%),
          #090b12;
      }
      main {
        width: min(640px, 100%);
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 20px;
        background: rgba(17, 20, 31, .94);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .55);
      }
      .eyebrow {
        color: #ff4db2;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 { margin: 8px 0 6px; font-size: 25px; }
      p { margin: 0 0 16px; color: #aeb4c7; line-height: 1.45; }
      img {
        display: block;
        width: 100%;
        max-height: 470px;
        object-fit: contain;
        border-radius: 13px;
        background: #05060a;
        border: 1px solid rgba(255, 255, 255, .08);
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 15px 18px;
        border: 0;
        border-radius: 12px;
        color: white;
        background: linear-gradient(135deg, #ff2a9b, #b828ff);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      button:disabled { opacity: .55; cursor: wait; }
      #status {
        min-height: 24px;
        margin-top: 12px;
        color: #8fffd6;
        font-weight: 700;
      }
      #status.error { color: #ff8ba4; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Nexus Live Annotator</div>
      <h1>Chrome potrebuje potvrdiť kopírovanie</h1>
      <p>
        Klikni raz na tlačidlo. Rozšírenie potom overí, že v systémovej schránke
        je práve tento nový PNG.
      </p>
      <img id="preview" alt="Náhľad anotovaného screenshotu" />
      <button id="copy" type="button">Skopírovať nový PNG</button>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="clipboard.js"></script>
  </body>
</html>
