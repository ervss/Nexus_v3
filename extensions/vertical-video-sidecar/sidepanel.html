<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="sidepanel.css"><link rel="stylesheet" href="seek.css"></head>
<body><header><div><p class="eyebrow">SIDE / 09:16 <span id="libraryState">Nexus: checking…</span></p><h1>Sidecar</h1></div><div class="header-actions"><button id="cinema" class="icon" title="Fill the whole Sidecar" aria-label="Fill the whole Sidecar">⛶</button><button id="clear" class="icon" title="Clear queue" aria-label="Clear queue">⌫</button></div></header>
<div id="notice" hidden></div><main><section id="stage" class="fit"><video id="player" playsinline></video><canvas id="fxCanvas" hidden></canvas><div id="empty"><span>↗</span><h2>Your viewing lane is clear</h2><p>Right-click a video on any page, then choose <b>Add video to Sidecar</b>.</p></div><div id="zoomBadge" class="zoom-badge" hidden>1.0×</div><div id="radarMap" class="radar-map" title="Viewport Mini-Map (kliknutím presuniete výrez)" hidden><div id="radarBox" class="radar-box"></div></div><div id="seekWrap"><input id="seek" type="range" min="0" max="0" step="0.05" value="0" aria-label="Video position"></div><div id="hud"><span id="time">0:00 / 0:00</span><span id="mode">FIT</span></div><div id="cinemaTools"><button id="cinemaPrevious" title="Previous">‹</button><button id="cinemaPlay" class="primary" title="Play / pause">Play</button><button id="cinemaFit" title="Switch Fit / Fill">Fill</button><div class="cinema-presets"><button id="cinemaPresetL" title="Pohľad vľavo (A)">◂ L</button><button id="cinemaPresetC" title="Vycentrovať (S)">● C</button><button id="cinemaPresetR" title="Pohľad vpravo (D)">R ▸</button></div><select id="cinemaQuality" title="Rozlíšenie / kvalita"><option value="-1">Auto</option></select><button id="cinemaLoopAB" title="A-B Loop (Opakovanie scény)">A-B</button><button id="cinemaExit" title="Back to controls">⛶</button></div></section>
<section class="transport"><button id="previous" title="Previous (J)">‹</button><button id="play" class="primary" title="Play / pause (Space)">Play</button><button id="next" title="Next (L)">›</button><button id="downloadIdm" title="Send the active direct link to IDM Integration Module">Download IDM</button><button id="remove" title="Remove active video">Remove</button></section>
<section class="controls"><label>Speed <select id="rate"><option>0.25</option><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option><option>3</option><option>4</option></select></label><label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label><label>Quality <select id="qualitySelect"><option value="-1">Auto</option></select></label><button id="loop" aria-pressed="false">Loop</button><button id="loopAB" title="Opakovať vybraný úsek (A-B Loop)">A-B: Off</button><button id="mute" aria-pressed="false">Mute</button><button id="fit">Fit</button><button id="filter" title="WebGL sharpening, if CORS permits">FX</button></section>
<section class="scan"><div class="scan-top"><span>Pan &amp; scan</span><div class="scan-presets"><button id="presetL" title="Pohľad vľavo (A)">◂ L</button><button id="presetC" title="Stred (S)">● C</button><button id="presetR" title="Pohľad vpravo (D)">R ▸</button></div><button id="resetScan">Reset</button></div><label>Zoom <input id="zoom" type="range" min="1" max="4" step="0.05" value="1"></label><label>Horizontal <input id="panX" type="range" min="-100" max="100" value="0"></label><label>Vertical <input id="panY" type="range" min="-100" max="100" value="0"></label><label>Rotate <select id="rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><button id="mirror" aria-pressed="false">Mirror</button></section>
<details class="tuning"><summary>Picture tuning <span>brightness · color · sharpness</span></summary><div class="tuning-grid"><label>Brightness <input id="brightness" type="range" min="0.5" max="1.5" step="0.05" value="1"></label><label>Contrast <input id="contrast" type="range" min="0.5" max="1.7" step="0.05" value="1"></label><label>Saturation <input id="saturation" type="range" min="0" max="2" step="0.05" value="1"></label><label>Hue <input id="hue" type="range" min="-180" max="180" step="1" value="0"></label><label>Soften <input id="blur" type="range" min="0" max="3" step="0.1" value="0"></label><label>Sharpen <input id="sharpness" type="range" min="0" max="1" step="0.05" value="0.25"></label></div></details>
<section class="queue-head"><h2>Queue <span id="count">0</span></h2><span>Drag to reorder</span></section><ol id="queue"></ol><details class="history"><summary>Playback history <span id="historyCount">0</span></summary><div class="history-tools"><span>Recently played</span><button id="clearHistory" type="button">Clear</button></div><ol id="history"></ol></details></main><script src="vendor/hls.min.js"></script><script src="sidepanel.js"></script></body></html>
