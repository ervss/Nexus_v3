<script>
  const vvid = "GWr1tx9YGLUK1";
  var pingSent = false;
  var player = null;
  var refreshTimer = null;
  var currentSignedUrl = null;

  function getExpiryFromUrl(url) {
    try {
      var urlObj = new URL(url);
      var exp = urlObj.searchParams.get('exp');
      return exp ? parseInt(exp, 10) : null;
    } catch (e) {
      return null;
    }
  }

  function scheduleUrlRefresh(signedUrl) {
    if (refreshTimer) {
      clearTimeout(refreshTimer);
    }

    var expiry = getExpiryFromUrl(signedUrl);
    if (!expiry) return;

    var now = Math.floor(Date.now() / 1000);
    var timeUntilExpiry = expiry - now;

    var refreshIn = Math.max((timeUntilExpiry - 60) * 1000, 10000);

    console.log('URL expires in ' + timeUntilExpiry + 's, refreshing in ' + Math.round(refreshIn/1000) + 's');

    refreshTimer = setTimeout(function() {
      refreshSignedUrl();
    }, refreshIn);
  }

  function isUrlExpiredOrExpiring(bufferSeconds) {
    if (!currentSignedUrl) return true;
    var expiry = getExpiryFromUrl(currentSignedUrl);
    if (!expiry) return true;
    var now = Math.floor(Date.now() / 1000);
    return (expiry - now) <= (bufferSeconds || 0);
  }

  function refreshSignedUrl(isErrorRecovery) {
    console.log('Refreshing signed URL...' + (isErrorRecovery ? ' (error recovery)' : ''));
    fetch('/api/sign?v=' + vvid)
      .then(function(response) { return response.json(); })
      .then(function(data) {
        if (data.success && data.url) {
          currentSignedUrl = data.url;
          var videoEl = document.getElementById('main-video');

          if (videoEl && player) {
            var currentTime = player.currentTime || 0;
            var wasPlaying = player.playing;

            videoEl.src = data.url;

            if ((isErrorRecovery || wasPlaying) && currentTime > 0) {
              videoEl.currentTime = currentTime;
              videoEl.play().catch(function() {});
            }

            console.log('Signed URL refreshed successfully');

            videoEl.removeAttribute('data-refresh-attempted');
          }

          scheduleUrlRefresh(data.url);
        } else {
          console.error('Failed to refresh signed URL');
          if (isErrorRecovery) {
            console.error('Network error');
          }
        }
      })
      .catch(function(err) {
        console.error('Error refreshing signed URL:', err);
        refreshTimer = setTimeout(function() { refreshSignedUrl(isErrorRecovery); }, 30000);
      });
  }

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      if (isUrlExpiredOrExpiring(60)) {
        console.log('Tab became visible and URL is expired/expiring, refreshing...');
        refreshSignedUrl(false);
      }
    }
  });

  document.addEventListener('DOMContentLoaded', function() {
    const loadingEl = document.getElementById('video-loading');
    const videoWrapper = document.getElementById('video-wrapper');
    const videoEl = document.getElementById('main-video');

    loadingEl.style.display = 'flex';

    fetch('/api/sign?v=' + vvid)
      .then(function(response) { return response.json(); })
      .then(function(data) {
        if (data.success && data.url) {
          currentSignedUrl = data.url;
          initPlayer(data.url);
          scheduleUrlRefresh(data.url);
        } else {
          console.error('Failed to get signed URL');
          console.error('Network error');
        }
      })
      .catch(function(err) {
        console.error('Failed to fetch signed URL:', err);
        console.error('Network error');
      });

    function initPlayer(signedUrl) {
      videoEl.src = signedUrl;

      videoWrapper.style.display = 'block';
      loadingEl.style.display = 'none';

      var plyrOptions = {
        controls: [
          'play-large',
          'play',
          'progress',
          'current-time',
          'mute',
          'volume',
          'pip',
          'download',
          'fullscreen',
        ],
        urls: {
          download: '/d/GWr1tx9YGLUK1',
        },
        playsinline: true,
        fullscreen: { enabled: true, fallback: true, iosNative: true }
      };
      
      plyrOptions.poster = 'https:\/\/cdn.turbo.cr\/thumbs\/GWr1tx9YGLUK1.jpg';
      
      player = new Plyr('#main-video', plyrOptions);

      player.on('ready', function() {
        const dlBtn = document.querySelector('a[data-plyr="download"]');
        if (dlBtn) dlBtn.removeAttribute('download');
      });

      videoEl.addEventListener('playing', function() {
        ping();
      }, { once: true });

      player.on('error', function(event) {
        console.error('Player error:', event);
        console.error('Playback error');
      });

      videoEl.addEventListener('error', function(event) {
        console.error('Video element error:', event);
        var errorCode = videoEl.error ? videoEl.error.code : 0;
        var errorMsg = videoEl.error ? videoEl.error.message : '';

        if (isUrlExpiredOrExpiring(0)) {
          console.log('Video error and URL is expired, attempting refresh...');
          refreshSignedUrl(true);
          return;
        }

        if (errorMsg.includes('No decoders') || errorMsg.includes('not supported') ||
            errorMsg.includes('octet-stream') || errorCode === 4) {
          console.error('Format error');
        } else if (errorCode === 2) {
          if (!event.target.hasAttribute('data-refresh-attempted')) {
            event.target.setAttribute('data-refresh-attempted', 'true');
            console.log('Network error, attempting URL refresh...');
            refreshSignedUrl(true);
            return;
          }
          console.error('Network error');
        } else {
          console.error('Playback error');
        }
      });
    }
  });


  function ping() {
    if (!pingSent) {
      var hostname = window.location.hostname;
      var url = "https://" + hostname + "/api/pst";

      fetch(url + "?pst=" + vvid + "&token=simp")
        .then(function() {
          console.log("View counted");
        })
        .catch(function(err) {
          console.log("Ping failed:", err);
        });
      pingSent = true;
    }
  }
</script>
