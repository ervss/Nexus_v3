    <template x-if="albumViewer.open">
    <div class="av-overlay nx-lazy-modal"
        @keydown.escape.window="closeAlbumViewer()" role="dialog" aria-modal="true" aria-label="Prehliadač albumu">
        <div class="av-sheet">
            <!-- Header -->
            <div class="av-header">
                <span class="material-icons-round av-header-icon">photo_library</span>
                <div class="av-title">
                    <span x-text="albumViewer.albumTitle || 'Album'"></span>
                    <small x-show="albumViewer.items.length" x-text="`${albumViewer.items.length} súborov`"></small>
                    <small x-show="albumViewer.isCombined" style="color:#a78bfa;font-weight:600;font-size:11px;">
                        <span x-text="albumViewer.fromHistory ? `Uložený fetch z ${albumViewer.sourceAlbums.length} albumov` : `Dočasný prehľad z ${albumViewer.sourceAlbums.length} albumov`"></span>
                    </small>
                    <small x-show="albumViewer.fromHistory && !albumViewer.isCombined" style="color:#a78bfa;font-weight:600;font-size:11px;">
                        Uložený fetch
                    </small>
                    <small x-show="albumViewer.dateFirst || albumViewer.dateLast"
                        style="color:#475569;font-weight:400;font-size:11px;">
                        <span class="material-icons-round" style="font-size:11px;vertical-align:middle;">upload</span>
                        <span
                            x-text="albumViewer.dateFirst ? new Intl.DateTimeFormat('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(albumViewer.dateFirst)) : '?'"></span>
                        <span x-show="albumViewer.dateLast"> – </span>
                        <span class="material-icons-round" x-show="albumViewer.dateLast"
                            style="font-size:11px;vertical-align:middle;">update</span>
                        <span x-show="albumViewer.dateLast"
                            x-text="albumViewer.dateLast ? new Intl.DateTimeFormat('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(albumViewer.dateLast)) : ''"></span>
                    </small>
                </div>
                <div class="av-header-actions">
                    <label class="av-hbtn" x-show="albumViewer.isCombined" title="Plynulý režim vykresľuje len karty v okolí obrazovky">
                        Zobrazenie <select x-model="albumViewer.renderMode" aria-label="Režim zobrazenia spoločného albumu" style="background:#0d1117;color:#c4b5fd;border:1px solid #59467d;border-radius:5px;padding:4px;">
                            <option value="smooth">Plynulé</option><option value="classic">Klasické</option>
                        </select>
                    </label>
                    <!-- Re-fetch button -->
                    <button class="av-hbtn av-hbtn-refetch"
                        @click="albumViewerFullFetch()"
                        :disabled="albumViewer.loading || albumViewer.refetching"
                        :title="albumViewer.isCombined ? 'Fresh načítanie kvality, rozlíšenia a dĺžky všetkých videí' : 'Načítať znova (full meta)'"><span class="material-icons-round"
                            :class="(albumViewer.loading || albumViewer.refetching) ? 'av-spin' : ''"
                            x-text="(albumViewer.loading || albumViewer.refetching) ? 'progress_activity' : 'refresh'"></span>
                        <span x-text="albumViewer.isCombined ? (albumViewer.refetching ? `Fetch… ${albumViewer.refetchDone}/${albumViewer.refetchTotal}${albumViewer.refetchActive ? ` · ${albumViewer.refetchActive} bežia` : ''}` : 'Full fetch') : 'Refresh'"></span>
                    </button>
                    <button class="av-hbtn" x-show="albumViewer.isCombined" @click="albumViewerSaveSelectionAlbum()"
                        :disabled="albumViewer.selected.size === 0 || albumViewer.savingSelectionAlbum"
                        title="Uloží označené videá ako samostatný album do Histórie">
                        <span class="material-icons-round">playlist_add</span><span x-text="albumViewer.savingSelectionAlbum ? 'Ukladám...' : 'Uložiť výber ako album'"></span>
                    </button>
                    <div class="av-header-primary-actions">
                        <button class="av-hbtn av-hbtn-import" @click="albumViewerImportSelected()"
                            :disabled="albumViewer.selected.size === 0 || albumViewer.importing">
                            <span class="material-icons-round" :class="albumViewer.importing ? 'av-spin' : ''"
                                x-text="albumViewer.importing ? 'progress_activity' : 'move_to_inbox'"></span>
                            <span x-text="albumViewer.importing ? 'Importujem...' : (albumViewer.selected.size > 0 ? `Import vybraných (${albumViewer.selected.size})` : 'Import vybraných')"></span>
                        </button>
                        <button class="av-hbtn" data-album-split-screen @click="albumViewerOpenSplitScreen()"
                            :disabled="albumViewer.selected.size === 0" title="Otvorí označené viditeľné videá priamo v Split-Screene (max. 12)">
                            <span class="material-icons-round">view_column</span><span>Split-Screen</span>
                        </button>
                    </div>
                    <button class="av-hbtn av-hbtn-close" @click="closeAlbumViewer()">
                        <span class="material-icons-round">close</span>
                    </button>
                </div>
            </div>

            <!-- Toolbar row 1: type filter + search + sort -->
            <div class="av-toolbar" x-show="albumViewer.items.length > 0">
                <!-- Type filter tabs -->
                <div class="av-filter-tabs">
                    <button class="av-filter-tab" :class="albumViewer.filter==='all'?'active':''"
                        @click="albumViewer.filter='all'">
                        Všetko <b x-text="albumViewer.items.length"></b>
                    </button>
                    <button class="av-filter-tab" :class="albumViewer.filter==='video'?'active':''"
                        @click="albumViewer.filter='video'" x-show="albumViewer.items.some(i=>i.type==='video')">
                        🎬 <b x-text="albumViewer.items.filter(i=>i.type==='video').length"></b>
                    </button>
                    <button class="av-filter-tab" x-show="(albumViewer.deltaInfo?.deltaNewCount || 0) > 0"
                        @click="albumViewerSelectDeltaNew()"
                        style="border-color:rgba(34,211,238,.45);color:#67e8f9;"
                        title="Označí iba videá, ktoré pribudli od poslednej návštevy tohto albumu">
                        ✨ Nové od návštevy <b x-text="`+${albumViewer.deltaInfo?.deltaNewCount || 0}`"></b>
                    </button>
                    <button class="av-filter-tab" x-show="(albumViewer.deltaInfo?.notInLibraryCount || 0) > 0"
                        @click="albumViewerSelectNotInLibrary()"
                        style="border-color:rgba(168,85,247,.45);color:#c4b5fd;"
                        title="Označí videá z albumu, ktoré ešte nie sú importované v knižnici">
                        📥 Mimo knižnice <b x-text="albumViewer.deltaInfo?.notInLibraryCount || 0"></b>
                    </button>
                    <button class="av-filter-tab" :class="albumViewer.filter==='image'?'active':''"
                        @click="albumViewer.filter='image'" x-show="albumViewer.items.some(i=>i.type==='image')">
                        🖼️ <b x-text="albumViewer.items.filter(i=>i.type==='image').length"></b>
                    </button>
                    <button class="av-filter-tab" :class="albumViewer.filter==='file'?'active':''"
                        @click="albumViewer.filter='file'" x-show="albumViewer.items.some(i=>i.type==='file')">
                        📄 <b x-text="albumViewer.items.filter(i=>i.type==='file').length"></b>
                    </button>
                    <button class="av-filter-tab" :class="albumViewer.showDuplicates?'active':''"
                        @click="albumViewerToggleDuplicates()"
                        x-show="albumViewer.isCombined && albumViewerDuplicateCount() > 0"
                        :title="albumViewer.showDuplicates ? 'Skryť nižšiu kvalitu a ponechať najlepší náhľad' : 'Zobraziť aj skryté duplicitné súbory'">
                        <span class="material-icons-round" style="font-size:14px;vertical-align:-2px;">content_copy</span>
                        <span x-text="albumViewer.showDuplicates ? 'Skryť duplicity' : 'Zobraziť duplicity'"></span>
                        <b x-text="albumViewerDuplicateCount()"></b>
                    </button>
                </div>

                <!-- Search -->
                <input class="av-search-input" type="text" x-model="albumViewer.search" placeholder="Hľadať v albume..."
                    style="margin-left:6px;">

                <!-- Multiple source albums can be filtered or removed from this view. -->
                <div class="av-ctrl-group av-source-picker" x-show="albumViewer.isCombined" @click.outside="albumViewer.sourceAlbumsMenuOpen = false" style="margin-left:8px;">
                    <span class="av-ctrl-label">Album</span>
                    <button type="button" class="av-source-trigger" @click="albumViewer.sourceAlbumsMenuOpen = !albumViewer.sourceAlbumsMenuOpen"
                        :aria-expanded="albumViewer.sourceAlbumsMenuOpen" aria-label="Vybrať zdrojové albumy">
                        <span x-text="albumViewer.sourceAlbumFilters.length ? `Vybrané albumy (${albumViewer.sourceAlbumFilters.length})` : `Všetky albumy (${albumViewer.sourceAlbums.length})`"></span> ▾
                    </button>
                    <div class="av-source-menu" x-show="albumViewer.sourceAlbumsMenuOpen" style="display:none;">
                        <button type="button" class="av-source-all" @click="albumViewer.sourceAlbumFilters = []; albumViewer.sourceAlbumFilter = 'all'">Zobraziť všetky albumy</button>
                        <template x-for="album in albumViewer.sourceAlbums" :key="album.url">
                            <div class="av-source-row">
                                <label><input type="checkbox" :checked="albumViewer.sourceAlbumFilters.includes(album.url)"
                                    @change="albumViewerToggleSourceAlbum(album.url)">
                                    <span x-text="`${album.title} (${albumViewerSourceAlbumFileCount(album.url)})`"></span></label>
                                <button type="button" class="av-source-remove" @click.stop="albumViewerRemoveSourceAlbum(album.url)"
                                    :disabled="albumViewer.loading || albumViewer.refetching || (albumViewer.fetchJobId &amp;&amp; !['completed','completed_with_errors','cancelled','failed'].includes(albumViewer.fetchState))"
                                    :aria-label="`Odstrániť ${album.title} zo spoločného albumu`" title="Odstrániť album z tohto prehľadu"><span class="material-icons-round">delete_outline</span></button>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="av-ctrl-group" x-show="albumViewer.isCombined" style="margin-left:8px;" role="group" aria-label="Orientácia videí">
                    <span class="av-ctrl-label">Orientácia</span>
                    <button type="button" class="av-sort-btn" :class="!albumViewer.onlyVertical &amp;&amp; !albumViewer.hideVertical ? 'active' : ''"
                        :aria-pressed="!albumViewer.onlyVertical &amp;&amp; !albumViewer.hideVertical" @click="albumViewer.onlyVertical=false; albumViewer.hideVertical=false" title="Všetky orientácie">All</button>
                    <button type="button" class="av-sort-btn" :class="albumViewer.onlyVertical ? 'active' : ''"
                        :aria-pressed="albumViewer.onlyVertical" @click="albumViewer.onlyVertical=true; albumViewer.hideVertical=false" title="Len vertikálne videá">Vert</button>
                    <button type="button" class="av-sort-btn" :class="albumViewer.hideVertical ? 'active' : ''"
                        :aria-pressed="albumViewer.hideVertical" @click="albumViewer.onlyVertical=false; albumViewer.hideVertical=true" title="Bez rozpoznaných vertikálnych videí; neznáma orientácia zostáva zobrazená">NoVert</button>
                    <button type="button" class="av-sort-btn" :class="albumViewer.portraitCards ? 'active' : ''"
                        :aria-pressed="albumViewer.portraitCards" @click="albumViewer.portraitCards = !albumViewer.portraitCards"
                        :title="albumViewer.portraitCards ? 'Prepnúť na jednotné široké karty' : 'Zobraziť vertikálne náhľady na výšku'"
                        x-text="albumViewer.portraitCards ? 'Karty na výšku' : 'Klasické karty'"></button>
                </div>
                <div class="av-ctrl-group" x-show="albumViewer.isCombined" style="margin-left:8px;">
                    <span class="av-ctrl-label">Obdobie</span>
                    <select x-model="albumViewer.recentFilter" aria-label="Filter obdobia videí"
                        title="Dátumové filtre vynechajú videá bez dátumu. Pri 10 videách sa bez dátumu použije poradie zdroja."
                        style="max-width:220px;background:#0d1117;border:1px solid rgba(167,139,250,.35);border-radius:5px;color:#c4b5fd;font-size:11px;padding:4px 7px;">
                        <option value="all">Všetky videá</option>
                        <option value="7">Posledných 7 dní</option>
                        <option value="14">Posledných 14 dní</option>
                        <option value="30">Posledných 30 dní</option>
                        <option value="10-per-album">Posledných 10 z každého albumu</option>
                        <option value="older-than">Staršie ako</option>
                        <option value="custom-per-album">Posledné videá z každého albumu</option>
                    </select>
                    <input x-show="albumViewer.recentFilter === 'older-than'" x-model="albumViewer.olderThanDays"
                        type="number" min="1" step="1" placeholder="Počet dní" aria-label="Staršie ako počet dní"
                        style="display:none;width:90px;background:#0d1117;border:1px solid rgba(167,139,250,.35);border-radius:5px;color:#c4b5fd;font-size:11px;padding:4px 7px;">
                    <input x-show="albumViewer.recentFilter === 'custom-per-album'" x-model="albumViewer.recentPerAlbumCount"
                        type="number" min="1" step="1" placeholder="Počet videí" aria-label="Počet posledných videí z každého albumu"
                        style="display:none;width:95px;background:#0d1117;border:1px solid rgba(167,139,250,.35);border-radius:5px;color:#c4b5fd;font-size:11px;padding:4px 7px;">
                </div>

                <!-- Sort -->
                <div class="av-ctrl-group" style="margin-left:8px;">
                    <span class="av-ctrl-label">Zoradiť</span>
                    <button class="av-sort-btn" :class="albumViewer.sort==='latest'?'active':''"
                        @click="albumViewer.sort='latest'; albumViewer.sortDir='desc'">Najnovšie</button>
                    <button class="av-sort-btn" :class="albumViewer.sort==='name'?'active':''"
                        @click="albumViewer.sort='name'">Názov</button>
                    <button class="av-sort-btn" :class="albumViewer.sort==='size'?'active':''"
                        @click="albumViewer.sort='size'">Veľkosť</button>
                    <button class="av-sort-btn" :class="albumViewer.sort==='dur'?'active':''"
                        @click="albumViewer.sort='dur'">Dĺžka</button>
                    <button class="av-sort-btn" :class="albumViewer.sort==='quality'?'active':''"
                        @click="albumViewer.sort='quality'">Rozlíšenie</button>
                    <button class="av-sort-btn" :class="albumViewer.sort==='type'?'active':''"
                        @click="albumViewer.sort='type'">Typ</button>
                    <button class="av-layout-btn"
                        @click="albumViewer.sortDir = albumViewer.sortDir==='asc'?'desc':'asc'"
                        :title="albumViewer.sortDir==='asc'?'Vzostupne':'Zostupne'">
                        <span class="material-icons-round"
                            x-text="albumViewer.sortDir==='asc'?'arrow_upward':'arrow_downward'"></span>
                    </button>
                </div>

                <!-- Grid layout -->
                <div class="av-ctrl-group" style="margin-left:8px;">
                    <span class="av-ctrl-label">Grid</span>
                    <button class="av-layout-btn" :class="albumViewer.layout==='2'?'active':''"
                        @click="albumViewer.layout='2'" title="2 stĺpce">
                        <span class="material-icons-round">view_column</span>
                    </button>
                    <button class="av-layout-btn" :class="albumViewer.layout==='3'?'active':''"
                        @click="albumViewer.layout='3'" title="3 stĺpce">
                        <span class="material-icons-round">view_module</span>
                    </button>
                    <button class="av-layout-btn" :class="albumViewer.layout==='4'?'active':''"
                        @click="albumViewer.layout='4'" title="4 stĺpce">
                        <span class="material-icons-round">grid_view</span>
                    </button>
                    <button class="av-layout-btn" :class="albumViewer.layout==='5'?'active':''"
                        @click="albumViewer.layout='5'" title="5 stĺpcov">
                        <span class="material-icons-round">apps</span>
                    </button>
                    <button class="av-layout-btn" :class="albumViewer.layout==='6'?'active':''"
                        @click="albumViewer.layout='6'" title="6 stĺpcov"
                        style="font-size:11px;font-weight:700;min-width:28px;">6×</button>
                    <button class="av-layout-btn" :class="albumViewer.layout==='7'?'active':''"
                        @click="albumViewer.layout='7'" title="7 stĺpcov"
                        style="font-size:11px;font-weight:700;min-width:28px;">7×</button>
                    <button class="av-layout-btn" :class="albumViewer.layout==='list'?'active':''"
                        @click="albumViewer.layout='list'" title="Zoznam">
                        <span class="material-icons-round">view_list</span>
                    </button>
                </div>

                <!-- HD PREVIEW (Bunkr Suite parity + enhancements) -->
                <div class="av-ctrl-group" style="margin-left:8px;border-left:1px solid rgba(255,255,255,.08);padding-left:8px;">
                    <span class="av-ctrl-label" style="color:#c084fc;">HD</span>
                    <button class="av-layout-btn" :class="albumViewer.hdMode==='2x2'?'active':''"
                        @click="albumViewerSetHdMode('2x2')" title="HD náhľady: 2×2 koláž (4 snímky zo storyboardu)"
                        style="font-size:11px;font-weight:700;min-width:32px;">2×2</button>
                    <button class="av-layout-btn" :class="albumViewer.hdMode==='1x'?'active':''"
                        @click="albumViewerSetHdMode('1x')" title="HD náhľady: 1 ostrá veľká snímka"
                        style="font-size:11px;font-weight:700;min-width:30px;">1×</button>
                    <button class="av-layout-btn" :class="albumViewer.hdMode==='off'?'active':''"
                        @click="albumViewerSetHdMode('off')" title="HD náhľady: Vypnuté (pôvodný náhľad)"
                        style="font-size:10px;min-width:30px;">Off</button>
                    <button class="av-hbtn" style="background:rgba(168,85,247,0.18);border:1px solid rgba(168,85,247,0.5);color:#e9d5ff;font-size:11px;padding:3px 9px;margin-left:4px;border-radius:5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;"
                        @click="albumViewerFetchHdThumbs('auto')"
                        :disabled="albumViewer.fetchingHd"
                        :title="albumViewer.selected.size > 0 ? `Načítať HD storyboardy pre ${albumViewer.selected.size} označených videí` : 'Načítať HD storyboardy; ak chýbajú, vytvoriť náhľad zo snímok videa'">
                        <span class="material-icons-round" :class="albumViewer.fetchingHd ? 'av-spin' : ''" style="font-size:14px;color:#c084fc;"
                            x-text="albumViewer.fetchingHd ? 'progress_activity' : 'photo_size_select_actual'"></span>
                        <span x-text="albumViewer.fetchingHd ? `HD… ${albumViewer.fetchHdDone}/${albumViewer.fetchHdTotal}` : (albumViewer.selected.size > 0 ? `Fetch HD (${albumViewer.selected.size})` : 'Fetch HD')"></span>
                    </button>
                </div>

                <!-- Select actions -->
                <div class="av-sel-label">
                    <template x-if="albumViewer.selected.size > 0">
                        <span>
                            <b x-text="albumViewer.selected.size"></b> vybr. &nbsp;·&nbsp;
                            <a href="#" @click.prevent="albumViewerSelectAll()"
                                style="color:#7c3aed;text-decoration:none;font-size:12px;font-weight:600;">+všetko</a>
                            &nbsp;·&nbsp;
                            <a href="#" @click.prevent="albumViewerSelectVideosOnly()"
                                style="color:#38bdf8;text-decoration:none;font-size:12px;">len video</a>
                            &nbsp;·&nbsp;
                            <a href="#" @click.prevent="albumViewerClear()"
                                style="color:#64748b;text-decoration:none;font-size:12px;">zrušiť</a>
                            <template x-if="albumViewer.isCombined">
                                <span> &nbsp;·&nbsp;
                                    <a href="#" @click.prevent="albumViewerRemoveSelected()"
                                        :style="albumViewer.loading || albumViewer.refetching ? 'pointer-events:none;opacity:.5;' : ''"
                                        style="color:#fb7185;text-decoration:none;font-size:12px;font-weight:600;"
                                        title="Odstráni označené súbory z tohto spoločného prehľadu">Odstrániť označené</a>
                                </span>
                            </template>
                            &nbsp;·&nbsp;
                            <a href="#" @click.prevent="albumViewerRefetchMeta('selected')"
                                :style="albumViewer.refetching ? 'pointer-events:none;opacity:.5;' : ''"
                                style="color:#2dd4bf;text-decoration:none;font-size:12px;font-weight:600;"
                                title="Znova stiahnuť dĺžku a rozlíšenie pre označené karty (obíde cache)">
                                <span class="material-icons-round" :class="albumViewer.refetching ? 'av-spin' : ''"
                                    style="font-size:13px;vertical-align:middle;">refresh</span>
                                <span
                                    x-text="albumViewer.refetching ? `Fetch… ${albumViewer.refetchDone}/${albumViewer.refetchTotal}${albumViewer.refetchActive ? ` · ${albumViewer.refetchActive} bežia` : ''}` : 'Fetch meta znova'"></span>
                            </a>
                            &nbsp;·&nbsp;
                            <a href="#" @click.prevent="albumViewerFetchHdThumbs('selected')"
                                :style="albumViewer.fetchingHd ? 'pointer-events:none;opacity:.5;' : ''"
                                style="color:#c084fc;text-decoration:none;font-size:12px;font-weight:600;"
                                title="Načítať HD storyboardy; ak chýbajú, vytvoriť náhľady zo snímok označených videí">
                                <span class="material-icons-round" :class="albumViewer.fetchingHd ? 'av-spin' : ''"
                                    style="font-size:13px;vertical-align:middle;">photo_size_select_actual</span>
                                <span x-text="albumViewer.fetchingHd ? `HD… ${albumViewer.fetchHdDone}/${albumViewer.fetchHdTotal}` : 'Fetch HD'"></span>
                            </a>
                        </span>
                    </template>
                    <template x-if="albumViewer.selected.size === 0">
                        <span>
                            <a href="#" @click.prevent="albumViewerSelectAll()"
                                style="color:#7c3aed;text-decoration:none;font-size:12px;font-weight:600;">Vybrať
                                všetko</a>
                            &nbsp;·&nbsp;
                            <a href="#" @click.prevent="albumViewerSelectVideosOnly()"
                                style="color:#38bdf8;text-decoration:none;font-size:12px;">len video</a>
                        </span>
                    </template>
                </div>
            </div>

            <div x-show="albumViewer.isCombined &amp;&amp; albumViewer.items.length" x-init="albumViewerAiCategories()"
                style="display:none;padding:10px 16px;background:#171225;border-bottom:1px solid #49356a;color:#e9ddff;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <strong>✨ Lokálna AI analýza</strong>
                    <label>Kategória
                        <select x-model="albumViewer.ai.category" :disabled="albumViewer.ai.running" @change="albumViewerResetAi()" aria-label="AI kategória">
                            <template x-for="category in albumViewer.ai.categories" :key="category"><option :value="category" x-text="category"></option></template>
                        </select>
                    </label>
                    <label>Režim
                        <select x-model="albumViewer.ai.mode" :disabled="albumViewer.ai.running" aria-label="Režim AI analýzy">
                            <option value="quick">Rýchly · náhľad</option><option value="deep">Dôkladný · 6 záberov</option>
                        </select>
                    </label>
                    <button class="av-hbtn" @click="albumViewerAiStart()" :disabled="albumViewer.ai.running || !albumViewer.ai.categories.length">Analyzovať viditeľné videá</button>
                    <button class="av-hbtn" x-show="albumViewer.ai.running" @click="albumViewerAiCancel()">Zastaviť</button>
                    <span x-show="albumViewer.ai.total" x-text="`${albumViewer.ai.running ? 'Analyzujem' : 'Spracované'} ${albumViewer.ai.done}/${albumViewer.ai.total}`"></span>
                    <label x-show="albumViewer.ai.done">Výsledok
                        <select x-model="albumViewer.ai.filter" aria-label="Filter AI výsledkov">
                            <option value="all">Všetky</option>

                </div>
                <small style="display:block;margin-top:5px;color:#c4b5d5;">AI je orientačná a môže scénu prehliadnuť. Dôkladná analýza načíta časti videa zo zdroja. Výsledky platia počas otvorenia albumu.</small>

            <!-- Stats bar -->

                    <span><b x-text="albumViewer.virtual.items.length"></b> súborov</span>
                </div>
                <div class="av-stat-chip">
                    <span class="material-icons-round">movie</span>
                    <span><b
                            x-text="albumViewer.virtual.items.filter(i=>i.type==='video'||/\.(mp4|mkv|webm|mov|m4v|avi|m3u8)(\?|$)/i.test(i.stream_url||'')).length"></b>
                        videí</span>
                </div>
                <div class="av-stat-chip">
                    <span class="material-icons-round">image</span>
                    <span><b x-text="albumViewer.virtual.items.filter(i=>i.type==='image').length"></b> fotiek</span>
                </div>
                <div class="av-stat-chip">
                    <span class="material-icons-round">sd_storage</span>
                    <span>Celkom: <b x-text="albumViewerTotalSize()"></b></span>
                </div>
                <div class="av-stat-chip" x-show="albumViewerTotalDuration() > 0">
                    <span class="material-icons-round">schedule</span>
                    <span>Trvanie: <b x-text="albumViewerTotalDurationStr()"></b></span>
                </div>

                    <button class="av-more-btn" @click="albumViewerCancelFetch()">Zastaviť fetch</button>
                </div>
                <div class="av-stat-chip" x-show="albumViewer.enriching">
                    <span class="material-icons-round av-spin" style="color:#a855f7;">progress_activity</span>
                    <span style="color:#a855f7;">meta <b x-text="albumViewer.enrichDone"></b>/<b
                            x-text="albumViewer.enrichTotal"></b></span>
                </div>
                <div class="av-stat-chip" x-show="!albumViewer.enriching && albumViewer.items.some(i=>i.enriched)">
                    <span class="material-icons-round" style="color:#2dd4bf;">verified</span>
                    <span style="color:#2dd4bf;"><b x-text="albumViewer.items.filter(i=>i.enriched).length"></b> s
                        meta</span>
                </div>
                <div class="av-stat-chip" x-show="albumViewer.items.some(i=>i.storyboard_url)">
                    <span class="material-icons-round" style="color:#c084fc;">photo_size_select_actual</span>
                    <span style="color:#e9d5ff;"><b x-text="albumViewer.items.filter(i=>i.storyboard_url).length"></b> HD</span>
                </div>
                <div class="av-stat-chip" x-show="albumViewer.fetchingHd">
                    <span class="material-icons-round av-spin" style="color:#c084fc;">progress_activity</span>
                    <span style="color:#e9d5ff;">HD fetch: <b x-text="albumViewer.fetchHdDone"></b>/<b x-text="albumViewer.fetchHdTotal"></b></span>
                    <button class="av-more-btn" @click="albumViewerCancelFetchHd()">Zastaviť</button>
                </div>
                <div class="av-stat-chip" x-show="albumViewer.isCombined && albumViewerDuplicateCount() > 0"
                    title="Rovnaké názvy a vizuálne podobné náhľady sa zoskupia; predvolene sa zobrazí súbor s najvyššou dostupnou kvalitou.">
                    <span class="material-icons-round" style="color:#f59e0b;">content_copy</span>
                    <span style="color:#fbbf24;"><b x-text="albumViewerDuplicateCount()"></b> duplicít</span>
                </div>
                <!-- Min size filter -->
                <div class="av-stat-chip" style="margin-left:auto;gap:8px;">
                    <span class="av-ctrl-label">Min.veľ.</span>
                    <select x-model="albumViewer.minSizeMb"
                        style="background:#0d1117;border:1px solid rgba(255,255,255,.08);border-radius:5px;color:#64748b;font-size:11px;padding:3px 6px;outline:none;">
                        <option value="0">Všetky</option>
                        <option value="10">10 MB+</option>
                        <option value="50">50 MB+</option>
                        <option value="100">100 MB+</option>
                        <option value="500">500 MB+</option>
                        <option value="1000">1 GB+</option>
                    </select>
                </div>
                <!-- Min duration filter -->
                <div class="av-stat-chip" style="gap:8px;">
                    <span class="av-ctrl-label">Min.dĺžka</span>
                    <select x-model.number="albumViewer.minDurSec"
                        style="background:#0d1117;border:1px solid rgba(255,255,255,.08);border-radius:5px;color:#64748b;font-size:11px;padding:3px 6px;outline:none;">
                        <option value="0">Všetky</option>
                        <option value="60">1 min+</option>
                        <option value="300">5 min+</option>
                        <option value="600">10 min+</option>
                        <option value="1800">30 min+</option>
                    </select>
                </div>
                <!-- Min resolution filter -->
                <div class="av-stat-chip" style="gap:8px;">
                    <span class="av-ctrl-label">Min.rozl.</span>
                    <select x-model.number="albumViewer.minHeightPx"
                        style="background:#0d1117;border:1px solid rgba(255,255,255,.08);border-radius:5px;color:#64748b;font-size:11px;padding:3px 6px;outline:none;">
                        <option value="0">Všetky</option>
                        <option value="480">480p+</option>
                        <option value="720">720p+</option>
                        <option value="1080">1080p+</option>
                        <option value="1440">1440p+</option>
                        <option value="2160">4K+</option>
                    </select>
                </div>

                <!-- Delete hidden items action -->
                <button class="av-hbtn"
                    style="background:rgba(239,68,68,0.15);color:#ef4444;font-size:11px;padding:3px 8px;margin-left:8px;border:1px solid rgba(239,68,68,0.3);border-radius:6px;font-weight:700;cursor:pointer;transition:all .2s;"
                    @click="albumViewerKeepVisibleOnly()"
                    x-show="albumViewer.items.length > albumViewer.virtual.items.length"
                    title="Odstráni z albumu všetky súbory, ktoré nespĺňajú aktuálne filtre, aby neprekážali pri načítavaní Meta.">
                    <span class="material-icons-round"
                        style="font-size:14px;margin-right:3px;vertical-align:middle;">delete_sweep</span>Zmazať skryté
                    (<span x-text="albumViewer.items.length - albumViewer.virtual.items.length"></span>)
                </button>
            </div>


            <!-- Batched meta loading for huge albums (hundreds/thousands of files) -->
            <div class="av-morebar" x-show="!albumViewer.isCombined && !albumViewer.loading && albumViewerUnenrichedCount() > 0">
                <span class="material-icons-round" :class="albumViewer.enriching ? 'av-spin' : ''"
                    style="color:#f59e0b;font-size:16px;"
                    x-text="albumViewer.enriching ? 'progress_activity' : 'hourglass_bottom'"></span>
                <span>Meta chýba pre <b x-text="albumViewerUnenrichedCount()"></b> súborov</span>
                <button class="av-more-btn" :class="albumViewer.autoMore ? 'av-more-auto-on' : ''"
                    @click="albumViewer.autoMore = !albumViewer.autoMore; if (albumViewer.autoMore) _avAutoContinue(_avSeq).catch(()=>{})"
                    :title="albumViewer.autoMore ? 'Automatické donačítanie beží — klikni pre pauzu' : 'Spustiť automatické donačítanie'">
                    <span class="material-icons-round" style="font-size:13px;vertical-align:middle;"
                        x-text="albumViewer.autoMore ? 'pause' : 'play_arrow'"></span>
                    Auto
                </button>
                <button class="av-more-btn" @click="albumViewerLoadMore(100)"
                    :disabled="albumViewer.enriching">+100</button>
                <button class="av-more-btn" @click="albumViewerLoadMore(500)"
                    :disabled="albumViewer.enriching">+500</button>
                <button class="av-more-btn av-more-all" @click="albumViewerLoadMore(0)"
                    :disabled="albumViewer.enriching">Všetky</button>
                <input class="av-more-input" type="number" min="1" step="50" x-model.number="albumViewer.moreCount"

                <button class="av-more-btn" @click="albumViewerLoadMore(albumViewer.moreCount || 100)"
                    :disabled="albumViewer.enriching">Načítaj</button>
            </div>

            <!-- Stragglers: video cards that were enriched but never got duration/quality
             (probe throttled or a blank row cached by an older build). Manual re-fetch. -->
            <div class="av-morebar" style="border-color:rgba(45,212,191,.28);"
                x-show="!albumViewer.loading && albumViewerUnenrichedCount() === 0 && albumViewerMissingMetaCount() > 0">
                <span class="material-icons-round" :class="albumViewer.refetching ? 'av-spin' : ''"
                    style="color:#2dd4bf;font-size:16px;"
                    x-text="albumViewer.refetching ? 'progress_activity' : 'sync_problem'"></span>
                <span><b x-text="albumViewerMissingMetaCount()"></b> videí bez dĺžky/rozlíšenia</span>
                <button class="av-more-btn av-more-all" style="border-color:rgba(45,212,191,.4);color:#2dd4bf;"
                    @click="albumViewerRefetchMeta('missing')" :disabled="albumViewer.refetching"
                    title="Znova stiahnuť metadata pre všetky viditeľné videá, ktorým chýba dĺžka/rozlíšenie">
                    <span class="material-icons-round" style="font-size:13px;vertical-align:middle;">refresh</span>
                    <span
                        x-text="albumViewer.refetching ? `${albumViewer.refetchDone}/${albumViewer.refetchTotal}` : 'Fetch chýbajúce'"></span>
                </button>
            </div>

            <!-- Body -->
            <div class="av-body" x-ref="avBody" @scroll.passive="albumViewerVirtualSchedule()" @resize.window="albumViewerVirtualSchedule()">
                <div x-show="albumViewer.isCombined &amp;&amp; albumViewer.indexProgress.active" role="status" style="color:#c4b5fd;font-size:12px;margin-bottom:10px;">
                    <span x-text="`Načítavam albumy ${albumViewer.indexProgress.done}/${albumViewer.indexProgress.total} · dostupných ${albumViewer.items.length} súborov · výsledky ešte pribúdajú`"></span>
                </div>
                <div x-show="albumViewer.isCombined &amp;&amp; !albumViewer.indexProgress.active &amp;&amp; albumViewer.error &amp;&amp; albumViewer.items.length" role="alert" style="color:#fbbf24;font-size:12px;margin-bottom:10px;" x-text="albumViewer.error"></div>
                <!-- Loading -->
                <div class="av-state" x-show="albumViewer.loading">
                    <span class="material-icons-round av-spin"
                        style="font-size:40px;color:#7c3aed;">progress_activity</span>
                    <div class="av-state-title" x-text="albumViewer.isCombined ? 'Spájam označené albumy...' : 'Načítavam obsah albumu...'"></div>
                    <div class="av-state-sub" x-text="albumViewer.isCombined ? `${albumViewer.sourceAlbums.length} albumov` : albumViewer.albumUrl"></div>
                </div>

                <!-- Error -->
                <div class="av-state" x-show="!albumViewer.loading && albumViewer.error && !albumViewer.items.length">
                    <span class="material-icons-round" style="color:#ef4444;">error_outline</span>
                    <div class="av-state-title">Nepodarilo sa načítať album</div>
                    <div class="av-state-sub" x-text="albumViewer.error"></div>
                    <button class="av-hbtn av-hbtn-refetch" style="margin-top:8px;"
                        @click="albumViewer.isCombined ? discoveryHubOpenSelectedAlbums(albumViewer.sourceAlbums) : openAlbumViewer({url: albumViewer.albumUrl, title: albumViewer.albumTitle, first_upload_at: albumViewer.dateFirst, last_upload_at: albumViewer.dateLast})">
                        <span class="material-icons-round">refresh</span> Skúsiť znova
                    </button>
                </div>

                <!-- Grid -->
                <div class="av-grid" x-ref="avGrid" x-init="albumViewerVirtualInit($el)" x-show="!albumViewer.loading && albumViewer.virtual.items.length > 0"

                    :class="'layout-' + (albumViewer.layout || '4')">
                    <div class="av-virtual-spacer" x-show="albumViewer.isCombined &amp;&amp; albumViewer.renderMode === 'smooth' &amp;&amp; albumViewer.virtual.top > 0" :style="`height:${albumViewer.virtual.top}px`" aria-hidden="true"></div>
                    <template x-for="(file, index) in albumViewerRenderItems()" :key="file.url">
                        <div class="av-item" :data-av-virtual-index="albumViewer.virtual.start + index"
                            :class="{ 'is-selected': albumViewer.selected.has(file.url), 'is-imported': albumViewer.importedUrls.has(file.url), 'is-duplicate': albumViewerIsDuplicate(file) }"
                            @click="albumViewerToggle(file)">

                            <div x-show="albumViewer.isCombined &amp;&amp; albumViewer.ai.results[file.url]" style="position:absolute;z-index:12;top:6px;left:42px;background:#241938;color:#fff;padding:3px 6px;border-radius:5px;font-size:11px;pointer-events:none;"
                                :title="albumViewer.ai.results[file.url]?.error || 'Orientačný AI výsledok'"
                                x-text="({match:'AI zhoda',uncertain:'AI neisté',unlikely:'AI slabá zhoda',failed:'AI nedostupné'}[albumViewer.ai.results[file.url]?.status] || '') + (albumViewer.ai.results[file.url]?.incomplete ? ' · neúplné' : '')"></div>
                            <!-- Checkbox -->
                            <div class="av-check">
                                <span class="material-icons-round">check</span>
                            </div>

                            <!-- Thumb -->
                            <div class="av-item-thumb"
                                :class="{ 'av-thumb-portrait-compact': albumViewerIsVertical(file) &amp;&amp; !albumViewer.portraitCards }"

                                <template x-if="file.thumbnail">
                                <img :src="albumViewerImageUrl(file.thumbnail, file.url)" loading="lazy"
                                        @load="albumViewerThumbnailLoaded($event, file)"
                                        @error="file.thumbnail=''; $el.style.display='none'">
                                </template>
                                <span class="av-vertical-badge" x-show="albumViewerIsVertical(file)">V</span>
                                <div class="av-item-no-thumb" :style="file.thumbnail ? 'display:none' : 'display:flex'">
                                    <span class="material-icons-round"
                                        x-text="file.type==='video' ? 'movie' : file.type==='image' ? 'image' : 'insert_drive_file'"></span>
                                </div>

                                <template x-if="file.storyboard_url || file._hdFallbackUrl">
                                    <img class="av-hd-preload" :src="albumViewerImageUrl(file._hdFallbackUrl || file.storyboard_url, file.url)" alt="" aria-hidden="true"
                                        @load="albumViewerHdPreviewLoaded($event, file)"
                                        @error="albumViewerHdPreviewFailed(file)">
                                </template>

                                <!-- HD Storyboard Overlay with interactive scrubbing -->
                                <template x-if="file._hdPreviewLoaded && (albumViewer.hdMode !== 'off' || !file.thumbnail)">
                                    <div class="av-hd-overlay"
                                        tabindex="0"
                                        role="slider"
                                        :aria-label="`Storyboard ${file.title || ''}`"
                                        :aria-valuenow="file._scrubFrame || 1"
                                        aria-valuemin="1"
                                        aria-valuemax="16"
                                        :class="albumViewer.hdMode === 'off' ? 'av-hd-fallback' : 'av-hd-' + albumViewer.hdMode"
                                        :style="`background-image: url('${albumViewerImageUrl(file._hdFallbackUrl || file.storyboard_url, file.url)}'); ${albumViewerHdStyle(file)}; ${file._scrubStyle || ''}`"
                                        @mousemove.stop="albumViewerScrubCard($event, file)"
                                        @touchmove.passive.stop="albumViewerScrubCard($event, file)"
                                        @touchend.passive.stop="albumViewerResetScrub(file)"
                                        @keydown="albumViewerKeyScrubCard($event, file)"
                                        @mouseleave.stop="albumViewerResetScrub(file)"
                                        @blur="albumViewerResetScrub(file)"
                                        @click.stop="albumViewerToggle(file)">
                                    </div>
                                </template>

                                <!-- Hover overlay with full title -->
                                <div class="av-item-hover-info">
                                    <div class="av-item-hover-title" x-text="file.title"></div>
                                </div>

                                <!-- Quick-play button (any playable file: video type OR has stream_url with video ext) -->
                                <template
                                    x-if="file.type === 'video' || (file.stream_url && /\.(mp4|mkv|webm|mov|m4v|avi|m3u8)(\?|$)/i.test(file.stream_url))">

                                        :class="albumViewer.player.file === file ? 'is-playing' : ''"
                                        @click.stop="albumViewerPlay(file)">
                                        <span class="material-icons-round"
                                            x-text="albumViewer.player.file === file && albumViewer.player.open ? 'stop' : 'play_arrow'"></span>
                                    </button>
                                </template>

                                <!-- type badge -->
                                <span class="av-type-badge"
                                    :class="file.type==='video'?'is-video':file.type==='image'?'is-image':''"
                                    x-text="file.ext ? file.ext.toUpperCase() : file.type"></span>

                                <!-- HD Storyboard Badge -->
                                <span x-show="file._hdPreviewLoaded"
                                    class="av-hd-badge"
                                    :title="file._scrubFrame && albumViewer.hdMode !== 'off' ? `HD storyboard načítaný (snímka ${file._scrubFrame}/16)` : 'HD náhľad načítaný · klikni pre celý storyboard'"
                                    @click.stop="albumViewerShowFullStoryboard(file)">
                                    <span class="material-icons-round" style="font-size:11px;vertical-align:middle;margin-right:2px;">photo_size_select_actual</span>
                                    <span x-text="file._scrubFrame && albumViewer.hdMode !== 'off' ? `${file._scrubFrame}/16` : 'HD'"></span>
                                </span>

                                <div class="av-thumb-metrics">
                                <!-- quality badge -->
                                <span x-show="file.quality" class="av-quality-badge"
                                    :class="(file.quality||'').includes('4K') ? 'q4k' : (file.quality||'').match(/1080|1440/) ? 'qhd' : 'qsd'"
                                    x-text="file.quality"></span>

                                <!-- duration -->
                                <span x-show="file.duration > 0" class="av-thumb-dur"
                                    x-text="formatDuration(file.duration)"></span>

                                <!-- size on thumb (list layout shows it in info) -->
                                <span x-show="file.size && (!file.size_suspect || file.size_verified) && albumViewer.layout !== 'list'" class="av-size-badge"
                                    x-text="file.size"></span>
                                <span x-show="file.size_suspect && !file.size_verified && albumViewer.layout !== 'list'" class="av-size-badge"
                                    title="Bunkr uviedol rovnakú neoverenú veľkosť pre väčšinu súborov. Full Fetch ju zistí z konkrétneho videa."
                                    style="background:rgba(146,64,14,.9);color:#fde68a;">Veľkosť neoverená</span>
                                </div>
                                <span x-show="albumViewerIsDuplicate(file)" class="av-duplicate-badge"
                                    :title="albumViewerDuplicateLabel(file)">
                                    <span class="material-icons-round">content_copy</span>
                                </span>
                            </div>

                            <!-- Info -->
                            <div class="av-item-info">
                                <div class="av-item-title" :title="file.title" x-text="file.title"></div>
                                <div class="av-item-meta">
                                    <span x-show="file.source_album_title" class="av-meta-pill"
                                        style="color:#c4b5fd;background:rgba(124,58,237,.14);"
                                        :title="(file.source_album_urls || [file.source_album_url]).filter(Boolean).join('\n')"
                                        x-text="(file.source_album_titles || [file.source_album_title]).filter(Boolean).join(' · ')"></span>
                                    <span x-show="albumViewerIsDuplicate(file)" class="av-meta-pill"
                                        style="color:#fbbf24;background:rgba(245,158,11,.12);"
                                        :title="albumViewerDuplicateLabel(file)"
                                        x-text="albumViewer.duplicateExactUrls.has(file.url) ? 'rovnaký súbor' : 'možná duplicita'"></span>
                                    <span x-show="file.size && (!file.size_suspect || file.size_verified)" class="av-meta-pill size" x-text="file.size"></span>
                                    <span x-show="file.size_suspect && !file.size_verified" class="av-meta-pill"
                                        style="color:#fbbf24;background:rgba(245,158,11,.12);"
                                        title="Veľkosť sa zistí pri Full Fetch z CDN súboru.">veľkosť: Full fetch</span>
                                    <span x-show="file.duration > 0" class="av-meta-pill dur"
                                        x-text="formatDuration(file.duration)"></span>
                                    <span x-show="file.height > 0" class="av-meta-pill"
                                        :class="file.height>=2160?'quality-4k':file.height>=1080?'quality-hd':'quality-sd'"
                                        x-text="(file.width && file.height) ? file.width + '×' + file.height : file.height + 'p'"></span>
                                    <span x-show="file.uploaded_at" class="av-meta-pill" style="color:#64748b;"
                                        x-text="file.uploaded_at ? new Intl.DateTimeFormat('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(file.uploaded_at)) : ''"></span>
                                    <span x-show="file.enriched" class="av-meta-pill"
                                        style="color:#2dd4bf;background:rgba(20,184,166,.1);">✓ meta</span>
                                </div>
                                <button class="av-meta-action" x-show="albumViewerIsMissingMeta(file)"
                                    @click.stop="albumViewerRefetchOne(file)" :disabled="!!file._refetching"
                                    title="Z tohto videa načíta chýbajúce trvanie, rozlíšenie a overenú veľkosť. Súbor tým neimportuje do knižnice.">
                                    <span class="material-icons-round" :class="file._refetching ? 'av-spin' : ''">refresh</span>
                                    <span x-text="file._refetching ? 'Načítavam údaje…' : 'Načítať údaje videa'"></span>
                                </button>
                                <div style="display:flex;gap:6px;margin-top:4px;">
                                    <button type="button" class="av-meta-action" style="margin-top:0;padding:3px 7px;font-size:10.5px;"
                                        @click.stop="stashItemToCollection(file, 'album')"
                                        :title="file._stashed ? 'Odložené v kolekcii' : 'Odložiť do kolekcie na neskôr'">
                                        <span class="material-icons-round" style="font-size:12px;" x-text="file._stashed ? 'bookmark' : 'bookmark_border'"></span>
                                        <span x-text="file._stashed ? 'Odložené' : 'Odložiť'"></span>
                                    </button>
                                    <button type="button" class="av-meta-action" style="margin-top:0;padding:3px 7px;font-size:10.5px;"
                                        @click.stop="shareItemLink(file, 'album')"
                                        title="Skopírovať odkaz na zdieľanie">
                                        <span class="material-icons-round" style="font-size:12px;">share</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                    <div class="av-virtual-spacer" x-show="albumViewer.isCombined &amp;&amp; albumViewer.renderMode === 'smooth' &amp;&amp; albumViewer.virtual.bottom > 0" :style="`height:${albumViewer.virtual.bottom}px`" aria-hidden="true"></div>
                </div>

                <!-- Empty after filter -->
                <div class="av-state"
                    x-show="!albumViewer.loading && albumViewer.items.length > 0 && albumViewer.virtual.items.length === 0">
                    <span class="material-icons-round" style="color:#334155;">filter_list_off</span>
                    <div class="av-state-title">Nič nezodpovedá filtru</div>
                    <div class="av-state-sub">Zmeň filter alebo vyhľadávanie</div>
                </div>
            </div>

            <!-- Full Storyboard Modal -->
            <div class="av-player-overlay" x-show="albumViewer.fullStoryboardModal.open" style="display:none;"
                @keydown.escape.window="albumViewer.fullStoryboardModal.open=false"
                @click.self="albumViewer.fullStoryboardModal.open=false">
                <div class="av-player-wrap" style="max-width:960px;background:#0d1117;border:1px solid #7c3aed;border-radius:12px;overflow:hidden;padding:16px;" @click.stop>
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                        <div style="font-weight:700;color:#f1f5f9;font-size:15px;display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                            <span class="material-icons-round" style="color:#c084fc;">photo_size_select_actual</span>
                            <span x-text="albumViewer.fullStoryboardModal.title"></span>
                        </div>
                        <button class="av-player-btn close" @click="albumViewer.fullStoryboardModal.open=false">
                            <span class="material-icons-round">close</span>
                        </button>
                    </div>
                    <div style="position:relative;background:#000;border-radius:8px;overflow:hidden;line-height:0;text-align:center;">
                        <img :src="albumViewer.fullStoryboardModal.url" style="max-width:100%;max-height:75vh;object-fit:contain;" alt="Full Storyboard">
                    </div>
                    <div style="margin-top:10px;font-size:12px;color:#94a3b8;display:flex;justify-content:space-between;align-items:center;">
                        <span>4×4 kontaktný hárok (16 HD snímok videa v plnom rozlíšení)</span>
                        <a :href="albumViewer.fullStoryboardModal.url" target="_blank" style="color:#38bdf8;text-decoration:none;font-weight:600;">Otvoriť originál ↗</a>
                    </div>
                </div>
            </div>

            <!-- Quick-Play modal (inside av-sheet so it covers only the viewer) -->
            <div class="av-player-overlay" x-show="albumViewer.player.open" style="display:none;"
                @keydown.escape.window="albumViewerClosePlayer()" @click.self="albumViewerClosePlayer()">
                <div class="av-player-wrap" @click.stop>
                    <!-- Top bar -->
                    <div class="av-player-topbar">
                        <span class="material-icons-round" style="color:#7c3aed;font-size:20px;">play_circle</span>
                        <div class="av-player-title" x-text="albumViewer.player.title"></div>
                        <div class="av-player-actions">
                            <span x-show="albumViewer.player.quality" class="av-quality-badge"
                                :class="(albumViewer.player.quality||'').includes('4K') ? 'q4k' : (albumViewer.player.quality||'').match(/1080|1440/) ? 'qhd' : 'qsd'"
                                x-text="albumViewer.player.quality" style="position:static;margin:0;"></span>
                            <button class="av-player-btn primary" @click="albumViewerImportFromPlayer()">
                                <span class="material-icons-round">download</span> Importovať
                            </button>
                            <button class="av-player-btn close" @click="albumViewerClosePlayer()">
                                <span class="material-icons-round">close</span>
                            </button>
                        </div>
                    </div>

                    <!-- Video element -->
                    <div style="position:relative;">
                        <video class="av-player-video" controls autoplay playsinline :src="albumViewer.player.url"
                            x-ref="avPlayerVideo" @error="albumViewerHandlePlayerError()"
                            @loadstart="albumViewer.player.loadError=false; albumViewer.player.loading=true"
                            @canplay="albumViewer.player.loading=false; albumViewer.player.refreshing=false; albumViewer.player.statusMessage=''; albumViewerStartPlaybackWatchdog()">
                        </video>
                        <!-- loading spinner -->
                        <div class="av-player-loading"
                            x-show="albumViewer.player.loading && !albumViewer.player.loadError">
                            <span class="material-icons-round av-spin"
                                style="font-size:48px;color:#7c3aed;">progress_activity</span>
                            <div x-show="albumViewer.player.statusMessage" x-text="albumViewer.player.statusMessage"
                                style="color:#e9d5ff;font-size:14px;font-weight:600;text-align:center;"></div>
                        </div>
                        <!-- error state -->
                        <div class="av-player-loading" x-show="albumViewer.player.loadError"
                            style="flex-direction:column;gap:10px;">
                            <span class="material-icons-round"
                                style="font-size:40px;color:#ef4444;">error_outline</span>
                            <div style="color:#fca5a5;font-size:13px;text-align:center;"
                                x-text="albumViewer.player.statusMessage || 'Video sa nedá prehrať cez prehliadač.'">
                            </div>
                            <button class="av-player-btn"
                                @click="albumViewer.player.retryCount=0; albumViewerHandlePlayerError()">
                                <span class="material-icons-round">refresh</span> Obnoviť link
                            </button>
                            <a :href="albumViewer.player.url" target="_blank" class="av-player-btn"
                                style="text-decoration:none;">
                                <span class="material-icons-round">open_in_new</span> Otvoriť priamo
                            </a>
                        </div>
                    </div>

                    <!-- Bottom nav: prev / counter / next -->
                    <div class="av-player-nav">
                        <button class="av-player-nav-btn" @click="albumViewerPlayerPrev()"
                            :disabled="albumViewer.player.idx <= 0">
                            <span class="material-icons-round">chevron_left</span> Predchádzajúce
                        </button>
                        <div class="av-player-nav-info">
                            <span x-text="albumViewer.player.idx + 1"></span> /
                            <span x-text="albumViewer.player.videoItems.length"></span>
                            &nbsp;·&nbsp;
                            <span x-text="formatDuration(albumViewer.player.duration)"></span>
                        </div>
                        <button class="av-player-nav-btn" @click="albumViewerPlayerNext()"
                            :disabled="albumViewer.player.idx >= albumViewer.player.videoItems.length - 1">
                            Ďalšie <span class="material-icons-round">chevron_right</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Import progress toast (fixed bottom) -->
            <div class="av-import-progress" x-show="albumViewer.importing" style="display:none;">
                <span class="material-icons-round av-spin"
                    style="color:#7c3aed;font-size:18px;">progress_activity</span>
                <div class="av-import-prog-bar">
                    <div class="av-import-prog-fill" :style="'width:' + (albumViewer.importPct||0) + '%'"></div>
                </div>
                <div class="av-import-prog-txt">Importujem <b x-text="albumViewer.selected.size"></b> súborov...</div>
            </div>
        </div>
    </div>
</template>
