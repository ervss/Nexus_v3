<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPorner Discovery — Nexus</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/theme.css?v=nx_v2">
    <link rel="stylesheet" href="/static/app_shell.css?v=nx_v2">
    <script src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <script src="/static/app_shell.js?v=nx_v2" defer></script>
    <style>
        html, body { overflow: auto !important; height: auto !important; }

        :root {
            --ep-accent: #f97316;
            --ep-accent2: #dc2626;
            --ep-glow: rgba(249,115,22,0.35);
        }

        .ep-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px 24px 100px;
        }

        .ep-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .ep-header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--ep-accent), var(--ep-accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        .ep-header .logo {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--ep-accent), var(--ep-accent2));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; font-weight: 900; color: white; flex-shrink: 0;
        }
        .ep-header a.back {
            color: rgba(255,255,255,.5);
            text-decoration: none;
            font-size: 13px;
            margin-left: auto;
            display: flex; align-items: center; gap: 4px;
        }
        .ep-header a.back:hover { color: rgba(255,255,255,.8); }

        .ep-controls {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .ctrl-group { display: flex; flex-direction: column; gap: 5px; }
        .ctrl-group label {
            font-size: 11px; font-weight: 600;
            color: rgba(255,255,255,.45);
            text-transform: uppercase; letter-spacing: .5px;
        }
        .ctrl-group input, .ctrl-group select {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.13);
            border-radius: 8px;
            color: #fff;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            transition: border-color .2s;
        }
        .ctrl-group input:focus, .ctrl-group select:focus {
            border-color: var(--ep-accent);
        }
        .ctrl-group input { min-width: 220px; }
        .ctrl-group select { min-width: 150px; }
        .ctrl-group select option { background: #1a1a2e; }

        .btn-search {
            background: linear-gradient(135deg, var(--ep-accent), var(--ep-accent2));
            border: none; border-radius: 9px;
            color: white; font-weight: 700; font-size: 14px;
            padding: 9px 22px; cursor: pointer;
            display: flex; align-items: center; gap: 7px;
            transition: opacity .15s, transform .1s;
            align-self: flex-end;
        }
        .btn-search:hover { opacity: .9; transform: translateY(-1px); }
        .btn-search:disabled { opacity: .5; cursor: not-allowed; }

        /* ── Status bar ── */
        .ep-status {
            font-size: 13px;
            color: rgba(255,255,255,.5);
            margin-bottom: 14px;
            display: flex; align-items: center; gap: 10px;
        }
        .ep-status strong { color: var(--ep-accent); }

        /* ── Grid ── */
        .ep-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .ep-card {
            background: rgba(255,255,255,0.04);
            border: 1.5px solid transparent;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color .15s, transform .15s, box-shadow .15s;
            position: relative;
        }
        .ep-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
        .ep-card.selected {
            border-color: var(--ep-accent);
            box-shadow: 0 0 0 2px var(--ep-glow);
        }
        .ep-card .check-badge {
            position: absolute; top: 8px; right: 8px;
            width: 22px; height: 22px;
            background: var(--ep-accent);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; color: white; font-weight: 900;
            opacity: 0; transition: opacity .15s;
            z-index: 2;
        }
        .ep-card.selected .check-badge { opacity: 1; }

        .ep-thumb {
            width: 100%; aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            background: rgba(255,255,255,.04);
        }
        .ep-thumb-wrap { position: relative; }
        .ep-duration {
            position: absolute; bottom: 6px; right: 7px;
            background: rgba(0,0,0,.75);
            color: #fff; font-size: 11px; font-weight: 700;
            padding: 2px 6px; border-radius: 4px;
        }

        .ep-info {
            padding: 9px 10px 10px;
        }
        .ep-title {
            font-size: 12px; font-weight: 600;
            color: rgba(255,255,255,.9);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .ep-meta {
            display: flex; gap: 8px;
            font-size: 11px; color: rgba(255,255,255,.4);
        }
        .ep-meta .views { color: rgba(255,255,255,.55); }
        .ep-meta .rate { color: #f59e0b; font-weight: 700; }

        /* ── Bottom action bar ── */
        .ep-action-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15,15,25,0.97);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,.08);
            padding: 12px 24px;
            display: flex; align-items: center; gap: 12px;
            z-index: 100;
        }
        .ep-action-bar .sel-count {
            font-size: 13px; color: rgba(255,255,255,.6);
        }
        .ep-action-bar .sel-count strong { color: var(--ep-accent); font-size: 15px; }
        .ep-action-bar input.batch-name {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.13);
            border-radius: 8px; color: #fff;
            padding: 7px 12px; font-size: 13px;
            outline: none; width: 220px;
        }
        .ep-action-bar input.batch-name:focus { border-color: var(--ep-accent); }

        .btn-import {
            background: linear-gradient(135deg, var(--ep-accent), var(--ep-accent2));
            border: none; border-radius: 9px;
            color: white; font-weight: 700; font-size: 14px;
            padding: 9px 22px; cursor: pointer;
            display: flex; align-items: center; gap: 7px;
            transition: opacity .15s;
        }
        .btn-import:hover { opacity: .9; }
        .btn-import:disabled { opacity: .5; cursor: not-allowed; }

        .btn-sel-all {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 8px; color: rgba(255,255,255,.7);
            font-size: 12px; font-weight: 600;
            padding: 7px 14px; cursor: pointer;
        }
        .btn-sel-all:hover { background: rgba(255,255,255,.12); }

        .ep-toast {
            position: fixed; top: 20px; right: 20px;
            background: #1e3a2f; border: 1px solid #22c55e;
            color: #86efac; padding: 12px 18px;
            border-radius: 10px; font-size: 13px; font-weight: 600;
            z-index: 9999; transition: opacity .3s;
        }
        .ep-toast.error { background: #3a1e1e; border-color: #ef4444; color: #fca5a5; }

        .ep-empty {
            text-align: center; padding: 60px 20px;
            color: rgba(255,255,255,.3); font-size: 15px;
        }
        .ep-spinner {
            display: flex; justify-content: center; align-items: center;
            padding: 60px; color: var(--ep-accent); gap: 12px; font-size: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; display: inline-block; }

        /* pagination */
        .ep-pagination {
            display: flex; justify-content: center;
            gap: 8px; margin-bottom: 30px;
        }
        .ep-pagination button {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 8px; color: rgba(255,255,255,.7);
            font-size: 13px; font-weight: 600;
            padding: 7px 16px; cursor: pointer;
            transition: background .15s;
        }
        .ep-pagination button:hover { background: rgba(255,255,255,.14); }
        .ep-pagination button.active {
            background: var(--ep-accent);
            border-color: var(--ep-accent);
            color: white;
        }
        .ep-pagination button:disabled { opacity: .4; cursor: not-allowed; }
    </style>
</head>
<body>
<div x-data="epornerDisc()" x-init="init()" class="ep-container">

    <!-- Header -->
    <div class="ep-header">
        <div class="logo">E</div>
        <h1>EPorner Discovery</h1>
        <a href="/" class="back">← Späť na dashboard</a>
    </div>

    <!-- Controls -->
    <div class="ep-controls">
        <div class="ctrl-group" style="flex:1;min-width:200px;">
            <label>Hľadať</label>
            <input type="text" x-model="query" placeholder="milf, teen, BBC..."
                   @keydown.enter="searchPage=1; doSearch()">
        </div>
        <div class="ctrl-group">
            <label>Kategória</label>
            <select x-model="category">
                <option value="">— všetky —</option>
                <template x-for="c in categories" :key="c.value">
                    <option :value="c.value" x-text="c.label"></option>
                </template>
            </select>
        </div>
        <div class="ctrl-group">
            <label>Zoradiť</label>
            <select x-model="order">
                <option value="top_rated">Top rated</option>
                <option value="most_popular">Najpopulárnejšie</option>
                <option value="latest">Najnovšie</option>
                <option value="longest">Najdlhšie</option>
                <option value="shortest">Najkratšie</option>
                <option value="top_weekly">Top týždeň</option>
                <option value="top_monthly">Top mesiac</option>
            </select>
        </div>
        <div class="ctrl-group">
            <label>Počet</label>
            <select x-model.number="perPage">
                <option value="12">12</option>
                <option value="24" selected>24</option>
                <option value="36">36</option>
                <option value="48">48</option>
            </select>
        </div>
        <button class="btn-search" @click="searchPage=1; doSearch()" :disabled="loading">
            <span :class="loading ? 'spin' : ''" style="font-size:16px;">⚡</span>
            <span x-text="loading ? 'Hľadám...' : 'Hľadať'"></span>
        </button>
    </div>

    <!-- Status -->
    <div class="ep-status" x-show="results.length > 0 || searched">
        <template x-if="results.length > 0">
            <span>Nájdených: <strong x-text="results.length"></strong> videí
                &nbsp;·&nbsp; Vybraných: <strong x-text="Object.keys(selected).length"></strong>
                &nbsp;·&nbsp; Strana <strong x-text="searchPage"></strong>
            </span>
        </template>
        <template x-if="searched && results.length === 0 && !loading">
            <span>Žiadne výsledky pre tento dotaz.</span>
        </template>
    </div>

    <!-- Loading -->
    <div class="ep-spinner" x-show="loading">
        <span class="spin" style="font-size:24px;">⚡</span>
        <span>Načítavam z EPorner...</span>
    </div>

    <!-- Grid -->
    <div class="ep-grid" x-show="!loading && results.length > 0">
        <template x-for="v in results" :key="v.video_id">
            <div class="ep-card" :class="selected[v.video_id] ? 'selected' : ''"
                 @click="toggleSelect(v.video_id)">
                <span class="check-badge">✓</span>
                <div class="ep-thumb-wrap">
                    <img class="ep-thumb"
                         :src="v.thumbnail ? `/api/v1/image-proxy?url=${encodeURIComponent(v.thumbnail)}&referer=${encodeURIComponent('https://www.eporner.com/')}` : '/static/placeholder.jpg'"
                         :alt="v.title" loading="lazy"
                         @error="$el.src='/static/placeholder.jpg'">
                    <span class="ep-duration" x-text="v.duration_str" x-show="v.duration_str"></span>
                </div>
                <div class="ep-info">
                    <div class="ep-title" x-text="v.title"></div>
                    <div class="ep-meta">
                        <span class="views" x-text="fmtViews(v.views) + ' views'"></span>
                        <span class="rate" x-text="v.rate ? '★ ' + v.rate : ''"></span>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Empty state -->
    <div class="ep-empty" x-show="!loading && searched && results.length === 0">
        <div style="font-size:2rem;margin-bottom:12px;">🔍</div>
        Žiadne výsledky. Skús iné kľúčové slovo alebo kategóriu.
    </div>

    <!-- Pagination -->
    <div class="ep-pagination" x-show="!loading && results.length > 0">
        <button @click="prevPage()" :disabled="searchPage <= 1">← Predchádzajúca</button>
        <button class="active" x-text="`Strana ${searchPage}`"></button>
        <button @click="nextPage()" :disabled="results.length < perPage">Ďalšia →</button>
    </div>

    <!-- Action bar -->
    <div class="ep-action-bar">
        <span class="sel-count">
            Vybrané: <strong x-text="Object.keys(selected).length"></strong>
        </span>
        <button class="btn-sel-all" @click="selectAll()" x-show="results.length > 0">
            Vybrať všetky
        </button>
        <button class="btn-sel-all" @click="selected = {}" x-show="Object.keys(selected).length > 0">
            Zrušiť výber
        </button>
        <input class="batch-name" type="text" x-model="batchName" placeholder="Názov batchu...">
        <button class="btn-import" @click="importSelected()"
                :disabled="Object.keys(selected).length === 0 || importing">
            <span x-text="importing ? 'Importujem...' : `⬇ Importovať (${Object.keys(selected).length})`"></span>
        </button>
    </div>

    <!-- Toast -->
    <div class="ep-toast" x-show="toast.show" :class="toast.error ? 'error' : ''"
         x-text="toast.msg" x-transition></div>

</div>

<script>
function epornerDisc() {
    return {
        query: '',
        category: '',
        order: 'top_rated',
        perPage: 24,
        searchPage: 1,
        results: [],
        selected: {},
        loading: false,
        importing: false,
        searched: false,
        batchName: '',
        toast: { show: false, msg: '', error: false },

        categories: [
            { value: 'AMATEUR', label: 'Amateur' },
            { value: 'ANAL', label: 'Anal' },
            { value: 'ASIAN', label: 'Asian' },
            { value: 'BBW', label: 'BBW' },
            { value: 'BDSM', label: 'BDSM' },
            { value: 'BIG_ASS', label: 'Big Ass' },
            { value: 'BIG_DICK', label: 'Big Dick' },
            { value: 'BIG_TITS', label: 'Big Tits' },
            { value: 'BLONDE', label: 'Blonde' },
            { value: 'BLOWJOB', label: 'Blowjob' },
            { value: 'BRUNETTE', label: 'Brunette' },
            { value: 'CREAMPIE', label: 'Creampie' },
            { value: 'CUMSHOT', label: 'Cumshot' },
            { value: 'EBONY', label: 'Ebony' },
            { value: 'FETISH', label: 'Fetish' },
            { value: 'GROUP_SEX', label: 'Group Sex' },
            { value: 'HARDCORE', label: 'Hardcore' },
            { value: 'HD', label: 'HD' },
            { value: 'HOMEMADE', label: 'Homemade' },
            { value: 'INTERRACIAL', label: 'Interracial' },
            { value: 'JAPANESE', label: 'Japanese' },
            { value: 'LATINA', label: 'Latina' },
            { value: 'LESBIAN', label: 'Lesbian' },
            { value: 'MASSAGE', label: 'Massage' },
            { value: 'MASTURBATION', label: 'Masturbation' },
            { value: 'MATURE', label: 'Mature' },
            { value: 'MILF', label: 'MILF' },
            { value: 'ORGY', label: 'Orgy' },
            { value: 'OUTDOOR', label: 'Outdoor' },
            { value: 'PETITE', label: 'Petite' },
            { value: 'POV', label: 'POV' },
            { value: 'PUBLIC', label: 'Public' },
            { value: 'REDHEAD', label: 'Redhead' },
            { value: 'SQUIRT', label: 'Squirt' },
            { value: 'TEEN', label: 'Teen' },
            { value: 'THREESOME', label: 'Threesome' },
            { value: 'TOYS', label: 'Toys' },
            { value: 'WEBCAM', label: 'Webcam' },
            { value: '_4K', label: '4K' },
            { value: '_60FPS', label: '60 FPS' },
        ],

        init() {
            this.batchName = 'EPorner ' + new Date().toLocaleDateString('sk-SK');
        },

        toggleSelect(id) {
            if (this.selected[id]) {
                delete this.selected[id];
            } else {
                this.selected[id] = true;
            }
            this.selected = { ...this.selected };
        },

        selectAll() {
            const s = {};
            this.results.forEach(v => { s[v.video_id] = true; });
            this.selected = s;
        },

        async doSearch() {
            this.loading = true;
            this.searched = false;
            this.results = [];
            this.selected = {};
            try {
                const resp = await fetch('/api/v1/eporner/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: this.query,
                        category: this.category,
                        page: this.searchPage,
                        per_page: this.perPage,
                        order: this.order,
                        gay: false,
                    })
                });
                const data = await resp.json();
                if (data.status === 'error') throw new Error(data.message);
                this.results = data.results || [];
            } catch (e) {
                this.showToast('Chyba: ' + e.message, true);
            } finally {
                this.loading = false;
                this.searched = true;
            }
        },

        async prevPage() {
            if (this.searchPage <= 1) return;
            this.searchPage--;
            await this.doSearch();
        },

        async nextPage() {
            this.searchPage++;
            await this.doSearch();
        },

        async importSelected() {
            const ids = Object.keys(this.selected);
            if (!ids.length) return;
            this.importing = true;
            const selectedVideos = this.results.filter(v => this.selected[v.video_id]);
            const payload = {
                selected_urls: selectedVideos.map(v => v.url),
                batch_name: this.batchName || null,
                results: selectedVideos.map(v => ({
                    url: v.url,
                    title: v.title,
                    thumbnail: v.thumbnail,
                    duration: v.duration,
                })),
            };
            try {
                const resp = await fetch('/api/v1/import/eporner_discovery/import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await resp.json();
                if (data.status === 'success') {
                    this.showToast(`✓ Importovaných ${data.count} videí do "${data.batch}"`, false);
                    this.selected = {};
                } else {
                    throw new Error(data.message || 'Neznáma chyba');
                }
            } catch (e) {
                this.showToast('Import zlyhal: ' + e.message, true);
            } finally {
                this.importing = false;
            }
        },

        fmtViews(n) {
            if (!n) return '0';
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
            return String(n);
        },

        showToast(msg, error = false) {
            this.toast = { show: true, msg, error };
            setTimeout(() => { this.toast.show = false; }, 4000);
        },
    };
}
</script>
</body>
</html>
