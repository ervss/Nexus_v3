<!DOCTYPE html>
<html lang="sk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Google Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#202124',
                            surface: '#303134',
                            text: '#E8EAED',
                            muted: '#9AA0A6',
                            border: '#5F6368',
                            link: '#8AB4F8',
                            hover: '#3C4043'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #202124;
            color: #E8EAED;
            font-family: Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        
        .search-input {
            background-color: #202124;
            border: 1px solid #5F6368;
            color: #E8EAED;
            border-radius: 24px;
            padding: 12px 24px;
            width: 100%;
            max-width: 700px;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            background-color: #303134;
            border-color: #8AB4F8;
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }

        .filter-btn {
            background-color: #303134;
            border: 1px solid #5F6368;
            color: #E8EAED;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .filter-btn:hover {
            background-color: #3C4043;
        }
        
        .filter-btn.active {
            background-color: #8AB4F8;
            color: #202124;
            border-color: #8AB4F8;
        }

        .result-item {
            max-width: 750px;
            margin-bottom: 32px;
            position: relative;
        }

        .result-link {
            color: #8AB4F8;
            font-size: 20px;
            text-decoration: none;
            line-height: 1.3;
        }

        .result-link:hover {
            text-decoration: underline;
        }

        .result-url {
            color: #9AA0A6;
            font-size: 14px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-snippet {
            color: #E8EAED;
            font-size: 14px;
            line-height: 1.58;
            margin-top: 4px;
        }

        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #8AB4F8;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .top-nav {
            display: flex;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid #3C4043;
        }

        .action-icon {
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .result-item:hover .action-icon {
            opacity: 1;
        }
    </style>
</head>
<body>
    {% raw %}
    <div id="app">
        <!-- Header -->
        <header class="top-nav">
            <div class="logo font-medium text-2xl mr-10 flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-blue-400"></i>
                <span class="text-white">Nexus</span><span class="text-blue-400">Hub</span>
            </div>
            
            <form @submit.prevent="submitSearch" class="relative flex-grow max-w-[700px]">
                <input 
                    type="text" 
                    v-model="query" 
                    class="search-input" 
                    placeholder="Vyhľadaj (napr. kissing)..."
                    autofocus
                >
                <div class="absolute right-4 top-1/2 transform -translate-y-1/2 flex gap-3 text-gray-400">
                    <button type="button" @click="expandKeywords" class="hover:text-purple-400 transition" title="Rozšíriť dopyt o synonymá">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </button>
                    <i class="fa-solid fa-magnifying-glass cursor-pointer hover:text-blue-400 transition" @click="submitSearch"></i>
                </div>
            </form>
            
            <div class="ml-auto flex items-center gap-4">
                <a href="/" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-house"></i> Dashboard</a>
            </div>
        </header>

        <!-- Advanced Filters -->
        <div class="px-[148px] py-4 border-b border-gray-700 flex flex-wrap gap-3 items-center bg-[#1a1b1e]">
            <div class="flex items-center gap-2 mr-2">
                <i class="fa-solid fa-sliders text-gray-500"></i>
                <span class="text-gray-400 text-sm font-medium">Filtre:</span>
            </div>
            
            <!-- Site Filter -->
            <input 
                type="text" 
                v-model="siteFilter" 
                placeholder="site:vkvideo.ru" 
                class="bg-dark-surface border border-dark-border text-sm rounded-full px-4 py-1.5 w-44 text-white focus:outline-none focus:border-blue-400 placeholder-gray-500"
            >

            <!-- Time Filter -->
            <select v-model="timeFilter" class="bg-dark-surface border border-dark-border text-sm rounded-full px-4 py-1.5 text-white focus:outline-none focus:border-blue-400 cursor-pointer">
                <option value="">Akékoľvek obdobie</option>
                <option value="qdr:d">Za posledných 24 hodín</option>
                <option value="qdr:w">Za posledný týždeň</option>
                <option value="qdr:m">Za posledný mesiac</option>
                <option value="qdr:y">Za posledný rok</option>
            </select>

            <!-- Geo/Lang -->
            <select v-model="geoLang" class="bg-dark-surface border border-dark-border text-sm rounded-full px-4 py-1.5 text-white focus:outline-none focus:border-blue-400 cursor-pointer">
                <option value="">Lokalita: Zákadná</option>
                <option value="ru">Lokalita: Rusko (VK)</option>
                <option value="us">Lokalita: USA</option>
            </select>

            <!-- Toggles -->
            <button @click="videosOnly = !videosOnly" :class="['filter-btn flex items-center gap-2', { 'active': videosOnly }]">
                <i class="fa-solid fa-play text-xs"></i> Iba Videá
            </button>

            <!-- Deep Search Toggle -->
            <button @click="deepSearch = !deepSearch" :class="['filter-btn flex items-center gap-2', deepSearch ? 'bg-purple-600/20 text-purple-400 border-purple-600/50' : '']" title="Vypne filter podobných výsledkov a stiahne naraz 100">
                <i class="fa-solid fa-layer-group text-xs"></i> 
                {{ deepSearch ? 'Deep Search (ON)' : 'Deep Search (OFF)' }}
            </button>

            <!-- NSFW Toggle -->
            <button @click="safeSearch = !safeSearch" :class="['filter-btn ml-auto flex items-center gap-2', safeSearch ? 'bg-green-600/20 text-green-400 border-green-600/50' : 'bg-red-600/20 text-red-400 border-red-600/50']">
                <i class="fa-solid" :class="safeSearch ? 'fa-shield' : 'fa-fire'"></i>
                {{ safeSearch ? 'SafeSearch: ON' : 'SafeSearch: OFF (NSFW)' }}
            </button>
        </div>

        <!-- Main Content -->
        <main class="px-[148px] py-8">
            <!-- Loading -->
            <div v-if="loading && page === 1" class="flex items-center gap-3 text-blue-400 py-4 font-medium">
                <div class="loading-spinner"></div>
                <span>Hľadám tie najlepšie výsledky...</span>
            </div>

            <!-- Error -->
            <div v-if="error" class="bg-red-900/30 border border-red-500/50 text-red-200 p-4 rounded-lg max-w-[750px] mb-6">
                <div class="flex items-start gap-3">
                    <i class="fa-solid fa-circle-exclamation mt-1"></i>
                    <div>
                        <h3 class="font-bold">Chyba pri vyhľadávaní</h3>
                        <p class="text-sm mt-1">{{ error }}</p>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div v-if="results.length > 0 && page === 1 && !loading" class="text-gray-400 text-sm mb-6 flex items-center gap-3">
                <i class="fa-solid fa-chart-simple text-blue-400"></i>
                Zobrazených {{ results.length }} výsledkov
            </div>

            <!-- Results -->
            <div class="space-y-8">
                <div v-for="(result, index) in results" :key="index" class="result-item flex gap-4 group">
                    <!-- Thumbnail if available -->
                    <div v-if="result.thumbnail" class="flex-shrink-0 mt-2 relative">
                        <img :src="result.thumbnail" class="w-[140px] h-[80px] object-cover rounded-md border border-gray-700 shadow-lg">
                    </div>
                    
                    <div class="flex-grow">
                        <div class="result-url">
                            <img :src="'https://www.google.com/s2/favicons?sz=16&domain_url=' + encodeURIComponent(result.link)" class="w-4 h-4 rounded-sm bg-white" @error="$event.target.style.display='none'">
                            <span class="truncate max-w-[400px]">{{ result.displayed_link || result.link }}</span>
                        </div>
                        <a :href="result.link" target="_blank" class="result-link block mb-1">
                            {{ result.title }}
                        </a>
                        <div class="result-snippet" v-html="highlightKeyword(result.snippet, query)"></div>
                    </div>

                    <!-- Quick Actions -->
                    <div class="action-icon absolute right-0 top-2 flex flex-col gap-2">
                        <button @click="copyLink(result.link)" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-2 rounded-full border border-gray-600 transition" title="Kopírovať odkaz">
                            <i class="fa-solid fa-link w-4 h-4 text-center"></i>
                        </button>
                        <a :href="'/tester?url=' + encodeURIComponent(result.link)" target="_blank" class="bg-blue-900 hover:bg-blue-800 text-blue-300 p-2 rounded-full border border-blue-700 transition" title="Poslať do Link Testeru">
                            <i class="fa-solid fa-flask w-4 h-4 text-center"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Load More -->
            <div v-if="hasNextPage" class="mt-10 max-w-[750px] text-center">
                <button 
                    @click="loadMore" 
                    :disabled="loading"
                    class="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:text-gray-500 text-white font-medium py-3 px-8 rounded-full transition shadow-lg"
                >
                    <span v-if="loading"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Načítavam...</span>
                    <span v-else>Zobraziť ďalšie výsledky <i class="fa-solid fa-arrow-down ml-2"></i></span>
                </button>
            </div>
        </main>
    </div>
    {% endraw %}

    <script>
        const { createApp, ref, computed } = Vue

        createApp({
            setup() {
                const query = ref('')
                const siteFilter = ref('vkvideo.ru')
                const timeFilter = ref('')
                const geoLang = ref('')
                const safeSearch = ref(false)
                const videosOnly = ref(true)
                const deepSearch = ref(true) // Turn on Deep Search by default for power users!
                
                const page = ref(1)
                const loading = ref(false)
                const results = ref([])
                const error = ref(null)
                const hasNextPage = ref(false)

                const submitSearch = () => {
                    page.value = 1;
                    results.value = [];
                    fetchResults();
                }

                const loadMore = () => {
                    page.value += 1;
                    fetchResults();
                }

                const fetchResults = async () => {
                    if (!query.value.trim() && !siteFilter.value.trim()) return;
                    
                    loading.value = true;
                    error.value = null;

                    try {
                        const response = await axios.post('/api/google/search', {
                            query: query.value,
                            site: siteFilter.value || null,
                            time_range: timeFilter.value || null,
                            safe_search: safeSearch.value,
                            videos_only: videosOnly.value,
                            page: page.value,
                            num: deepSearch.value ? 100 : 50, // Google vracia 10/request — backend ich zreťazí
                            filter_duplicates: !deepSearch.value, // Ak je deep search, vypneme filter
                            geo_lang: geoLang.value || null
                        });
                        
                        if (response.data && response.data.results) {
                            if (page.value === 1) {
                                results.value = response.data.results;
                            } else {
                                results.value = [...results.value, ...response.data.results];
                            }
                            hasNextPage.value = response.data.has_next;
                        }
                    } catch (err) {
                        console.error("Search error:", err);
                        error.value = err.response?.data?.detail || "Nastala chyba pri spojení so serverom. Skontrolujte API kľúč.";
                    } finally {
                        loading.value = false;
                    }
                }

                // AI Synonym Assistant (simple hardcoded dictionary for demonstration)
                const expandKeywords = () => {
                    if (!query.value) return;
                    
                    let q = query.value.toLowerCase();
                    const dictionary = {
                        "kissing": '(kissing OR kiss OR "make out" OR passionate)',
                        "leak": '(leak OR leaked OR onlyfans OR "mega.nz")',
                        "amateur": '(amateur OR homemade OR pov)',
                    };

                    let replaced = false;
                    for (const [key, val] of Object.entries(dictionary)) {
                        if (q.includes(key) && !q.includes("OR")) {
                            q = q.replace(key, val);
                            replaced = true;
                        }
                    }

                    if (replaced) {
                        query.value = q;
                        // Necháme používateľa kliknúť hľadať, aby videl zmenu
                    } else {
                        // General wrap if no specific synonym
                        if(!q.includes("OR")) {
                            query.value = `(${q} OR "${q}")`;
                        }
                    }
                }

                const copyLink = async (link) => {
                    try {
                        await navigator.clipboard.writeText(link);
                        // Optional: show small toast here
                    } catch (err) {
                        console.error('Failed to copy: ', err);
                    }
                }

                const highlightKeyword = (text, keyword) => {
                    if (!text || !keyword) return text;
                    // Očistíme query od operátorov a zátvoriek pre highlight
                    const cleanKeyword = keyword.replace(/[()"]/g, '').replace(/\bOR\b/gi, '');
                    const words = cleanKeyword.split(' ').filter(w => w.trim().length > 3);
                    
                    let result = text;
                    words.forEach(w => {
                        try {
                            const regex = new RegExp(`(${w.trim()})`, 'gi');
                            result = result.replace(regex, '<strong class="text-blue-300">$1</strong>');
                        } catch(e) {}
                    });
                    return result;
                }

                return {
                    query,
                    siteFilter,
                    timeFilter,
                    geoLang,
                    safeSearch,
                    videosOnly,
                    deepSearch,
                    loading,
                    results,
                    error,
                    page,
                    hasNextPage,
                    submitSearch,
                    loadMore,
                    expandKeywords,
                    copyLink,
                    highlightKeyword
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
