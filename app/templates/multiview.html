<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus · Multi-View</title>
<style>
:root{
  --bg:#07080c; --panel:#0e1017; --panel-2:#141824; --line:#1e2536;
  --txt:#e8ecf5; --dim:#8792ab; --accent:#7c5cff; --accent-2:#00e5ff; --danger:#ff4d6d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}

/* ---- Top bar ---- */
.topbar{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:linear-gradient(180deg,#0c0e15,#090a10);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{font-weight:800;letter-spacing:.5px;font-size:16px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand small{display:block;font-size:9px;letter-spacing:2px;color:var(--dim);-webkit-text-fill-color:var(--dim)}
.layouts{display:flex;gap:6px}
.lay-btn{width:34px;height:32px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;color:var(--dim);cursor:pointer;display:grid;place-items:center;transition:.15s}
.lay-btn:hover{border-color:var(--accent);color:var(--txt)}
.lay-btn.active{border-color:var(--accent);background:rgba(124,92,255,.16);color:#fff;box-shadow:0 0 0 1px var(--accent) inset}
.lay-btn svg{width:16px;height:16px}
.spacer{flex:1}
.toggle{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer;color:var(--dim);user-select:none;font-size:12.5px;transition:.15s}
.toggle:hover{color:var(--txt)}
.toggle.on{color:#fff;border-color:var(--accent-2);background:rgba(0,229,255,.12)}
.toggle .dot{width:8px;height:8px;border-radius:50%;background:#3a4258;transition:.15s}
.toggle.on .dot{background:var(--accent-2);box-shadow:0 0 8px var(--accent-2)}
.top-link{color:var(--dim);text-decoration:none;font-size:12.5px;padding:6px 10px;border-radius:8px}
.top-link:hover{color:#fff;background:var(--panel-2)}

/* ---- Layout wrap ---- */
.stage{position:absolute;inset:52px 0 0 0;display:grid;gap:6px;padding:6px;transition:.2s}
.stage.l1{grid-template-columns:1fr;grid-template-rows:1fr}
.stage.l2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.stage.l3{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr}
.stage.l4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.stage.l6{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
.stage.drawer-open{right:340px}

/* ---- Panel ---- */
.panel{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.panel.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 26px -6px var(--accent)}
.panel.audio-focus{border-color:var(--accent-2);box-shadow:0 0 0 1px var(--accent-2),0 0 30px -6px var(--accent-2)}
.panel video{width:100%;height:100%;object-fit:contain;background:#000;flex:1;min-height:0}
.empty{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;text-align:center;padding:16px}
.empty svg{width:40px;height:40px;opacity:.5}
.empty b{color:var(--txt);font-size:14px}
.empty span{font-size:12px}
.panel.dragover .empty,.panel.dragover{outline:2px dashed var(--accent);outline-offset:-8px}

/* panel badge */
.pbadge{position:absolute;top:8px;left:8px;z-index:5;display:flex;gap:6px;align-items:center;max-width:70%}
.pbadge .n{background:rgba(124,92,255,.85);color:#fff;font-weight:700;font-size:11px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
.pbadge .t{background:rgba(0,0,0,.6);backdrop-filter:blur(6px);padding:3px 8px;border-radius:6px;font-size:11px;color:#dfe4f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbadge .mute-ico{opacity:0;transition:.15s}
.panel .pclose{position:absolute;top:8px;right:8px;z-index:6;width:22px;height:22px;border-radius:6px;border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;opacity:0;transition:.15s}
.panel:hover .pclose{opacity:1}
.panel .pclose:hover{background:var(--danger)}

/* ---- Per-panel controls ---- */
.controls{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:8px 10px 9px;background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,.35) 70%,transparent);opacity:0;transform:translateY(6px);transition:.18s;pointer-events:none}
.panel:hover .controls,.panel.active .controls{opacity:1;transform:none;pointer-events:auto}
.seek{position:relative;height:5px;border-radius:3px;background:#2a3145;cursor:pointer;margin-bottom:8px}
.seek .buf{position:absolute;left:0;top:0;bottom:0;background:#3a445f;border-radius:3px;width:0}
.seek .prog{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0}
.seek .ab{position:absolute;top:-2px;bottom:-2px;background:rgba(255,214,10,.28);border-left:2px solid #ffd60a;border-right:2px solid #ffd60a;display:none}
.crow{display:flex;align-items:center;gap:9px}
.cbtn{background:none;border:none;color:#cfd6e6;cursor:pointer;padding:2px;display:grid;place-items:center;border-radius:5px}
.cbtn:hover{color:#fff;background:rgba(255,255,255,.12)}
.cbtn svg{width:17px;height:17px}
.cbtn.small svg{width:14px;height:14px}
.cbtn.on{color:var(--accent-2)}
.time{font-size:11px;color:#c2c9d8;font-variant-numeric:tabular-nums;white-space:nowrap}
.vol{width:56px;accent-color:var(--accent-2);cursor:pointer}
.rate{background:rgba(255,255,255,.1);border:none;color:#dfe4f0;font-size:11px;border-radius:5px;padding:2px 5px;cursor:pointer}
.rate:hover{background:rgba(255,255,255,.18)}
.ab-badge{font-size:10px;font-weight:700;color:#ffd60a;border:1px solid rgba(255,214,10,.5);border-radius:5px;padding:1px 5px;display:none}
.ab-badge.on{display:inline}
.cspacer{flex:1}

/* ---- Drawer (video picker) ---- */
.drawer{position:absolute;top:52px;right:0;bottom:0;width:340px;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:.2s;z-index:15;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer h3{padding:12px 14px;font-size:13px;letter-spacing:.5px;color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.drawer .search{margin:10px 12px;position:relative}
.drawer .search input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--txt);font-size:13px}
.drawer .search input:focus{outline:none;border-color:var(--accent)}
.vlist{flex:1;overflow-y:auto;padding:2px 10px 14px}
.vlist::-webkit-scrollbar{width:8px}.vlist::-webkit-scrollbar-thumb{background:#232a3c;border-radius:4px}
.vcard{display:flex;gap:9px;padding:7px;border-radius:9px;cursor:grab;transition:.12s;border:1px solid transparent}
.vcard:hover{background:var(--panel-2);border-color:var(--line)}
.vcard:active{cursor:grabbing}
.vcard .thumb{width:92px;height:54px;border-radius:6px;object-fit:cover;background:#1a1f2e;flex-shrink:0}
.vcard .meta{min-width:0;display:flex;flex-direction:column;justify-content:center}
.vcard .meta .ti{font-size:12px;color:#e2e7f2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vcard .meta .su{font-size:10.5px;color:var(--dim);margin-top:2px}
.drawer-toggle{display:flex;align-items:center;gap:7px}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);border:1px solid var(--line);color:var(--dim);font-size:11px;padding:6px 12px;border-radius:20px;z-index:30;pointer-events:none;opacity:0;transition:.3s}
.hint.show{opacity:1}
kbd{background:#20263a;border:1px solid #30384f;border-radius:4px;padding:0 5px;font-size:10px;color:#c7cede}
</style>
<script src="/static/playback_activity.js?v=20260930_activity_3" defer></script>
</head>
<body>
<div class="topbar">
  <div class="brand">NEXUS<small>MULTI-VIEW</small></div>
  <div class="layouts" id="layouts">
    <button class="lay-btn" data-l="1" title="1 panel"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="lay-btn active" data-l="2" title="2 panely"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="lay-btn" data-l="4" title="4 panely"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="lay-btn" data-l="6" title="6 panelov"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="4" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="6" y="1" width="4" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="1" width="4" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="9" width="4" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="6" y="9" width="4" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="11" y="9" width="4" height="6" rx=".8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
  </div>
  <div class="toggle on" id="tgAudio" title="Zvuk sleduje myš – hover nad panel = jeho zvuk, ostatné stlmené">
    <span class="dot"></span>Audio-focus
  </div>
  <div class="toggle" id="tgSync" title="Prehrávanie/seek synchronizované naprieč panelmi">
    <span class="dot"></span>Sync
  </div>
  <div class="spacer"></div>
  <div class="toggle drawer-toggle" id="tgDrawer">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h8"/></svg>Knižnica
  </div>
  <a class="top-link" href="/netflix">← Späť</a>
</div>

<div class="stage l2" id="stage"></div>

<aside class="drawer" id="drawer">
  <h3>📼 Knižnica — ťahaj do panelu</h3>
  <div class="search"><input id="vsearch" placeholder="Hľadať vo videách…" autocomplete="off"></div>
  <div class="vlist" id="vlist"></div>
</aside>

<div class="hint" id="hint"></div>

<script>
const API_LIST = "/api/videos";
const STREAM = id => `/stream_proxy/${id}.mp4`;
const PLACEHOLDER = "/static/placeholder.jpg";

const state = {
  layout: 2,
  audioFocus: true,
  sync: false,
  active: 0,
  panels: [],          // {id,title,el,video,...}
  library: [],
};

const $ = s => document.querySelector(s);
const stage = $("#stage");

/* ---------- helpers ---------- */
function fmt(t){ if(!isFinite(t)||t<0)t=0; const m=Math.floor(t/60),s=Math.floor(t%60); return `${m}:${String(s).padStart(2,'0')}`; }
function showHint(html){ const h=$("#hint"); h.innerHTML=html; h.classList.add("show"); clearTimeout(h._t); h._t=setTimeout(()=>h.classList.remove("show"),2600); }

/* ---------- build panels ---------- */
function buildStage(){
  stage.className = "stage l"+state.layout + (state.drawerOpen?" drawer-open":"");
  const prev = state.panels;
  stage.innerHTML="";
  state.panels=[];
  for(let i=0;i<state.layout;i++){
    const carry = prev[i] || null;
    state.panels.push(makePanel(i, carry));
  }
  applyAudioFocus();
}

function makePanel(idx, carry){
  const p = document.createElement("div");
  p.className="panel"+(idx===state.active?" active":"");
  p.dataset.idx=idx;
  p.innerHTML = `
    <div class="pbadge"><span class="n">${idx+1}</span><span class="t" style="display:none"></span></div>
    <button class="pclose" title="Vyprázdniť panel">✕</button>
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 5v14M5 12h14"/></svg>
      <b>Panel ${idx+1}</b><span>Klikni alebo pretiahni video z knižnice</span>
    </div>
    <video playsinline preload="metadata" style="display:none"></video>
    <div class="controls" style="display:none">
      <div class="seek"><div class="buf"></div><div class="ab"></div><div class="prog"></div></div>
      <div class="crow">
        <button class="cbtn play" title="Play/Pause (medzerník)"></button>
        <button class="cbtn small back" title="-10s">⏪</button>
        <button class="cbtn small fwd" title="+10s">⏩</button>
        <span class="time">0:00 / 0:00</span>
        <button class="cbtn small mute" title="Mute"></button>
        <input class="vol" type="range" min="0" max="1" step="0.02" value="1">
        <span class="cspacer"></span>
        <span class="ab-badge">A-B</span>
        <button class="cbtn small ab" title="A-B loop: 1× klik = štart, 2× = koniec, 3× = zrušiť">↺</button>
        <button class="cbtn small fstep-b" title="Snímka späť">◁|</button>
        <button class="cbtn small fstep-f" title="Snímka vpred">|▷</button>
        <select class="rate" title="Rýchlosť">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
          <option value="1" selected>1×</option><option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
        <button class="cbtn small pip" title="Picture-in-Picture">⧉</button>
        <button class="cbtn small full" title="Fullscreen">⛶</button>
      </div>
    </div>`;
  stage.appendChild(p);

  const panel = {
    idx, el:p,
    video:p.querySelector("video"),
    empty:p.querySelector(".empty"),
    controls:p.querySelector(".controls"),
    badgeT:p.querySelector(".pbadge .t"),
    id:null, title:null,
    ab:{a:null,b:null},
  };
  wirePanel(panel);
  if(carry && carry.id){ loadIntoPanel(panel, carry.id, carry.title); }
  return panel;
}

/* ---------- panel wiring ---------- */
function wirePanel(P){
  const p=P.el, v=P.video;
  const q=s=>p.querySelector(s);
  const prog=q(".prog"), buf=q(".buf"), seek=q(".seek"), abEl=q(".ab");
  const timeEl=q(".time"), playBtn=q(".play"), muteBtn=q(".mute");

  const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  const ICON_VOL='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>';
  const ICON_MUTE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3l2.5-2.5-1-1L15.5 11 13 8.5l-1 1L14.5 12 12 14.5l1 1L15.5 13l2.5 2.5 1-1z"/></svg>';
  playBtn.innerHTML=ICON_PLAY; muteBtn.innerHTML=ICON_VOL;

  // activate on click
  p.addEventListener("mousedown",()=>setActive(P.idx));
  P.empty.addEventListener("click",()=>{ setActive(P.idx); openDrawer(true); showHint("Vyber video z knižnice vpravo →"); });

  // drag & drop
  p.addEventListener("dragover",e=>{e.preventDefault();p.classList.add("dragover");});
  p.addEventListener("dragleave",()=>p.classList.remove("dragover"));
  p.addEventListener("drop",e=>{
    e.preventDefault();p.classList.remove("dragover");
    const id=e.dataTransfer.getData("vid"), title=e.dataTransfer.getData("vtitle");
    if(id){ loadIntoPanel(P,id,title); setActive(P.idx); }
  });

  q(".pclose").addEventListener("click",e=>{e.stopPropagation();clearPanel(P);});

  // audio focus hover
  p.addEventListener("mouseenter",()=>{ if(state.audioFocus){ state.hoverIdx=P.idx; applyAudioFocus(); }});
  p.addEventListener("mouseleave",()=>{ if(state.audioFocus){ if(state.hoverIdx===P.idx)state.hoverIdx=null; applyAudioFocus(); }});

  // playback events
  v.addEventListener("timeupdate",()=>{
    if(v.duration){ prog.style.width=(v.currentTime/v.duration*100)+"%"; timeEl.textContent=`${fmt(v.currentTime)} / ${fmt(v.duration)}`; }
    // A-B loop
    if(P.ab.a!=null && P.ab.b!=null && v.currentTime>=P.ab.b){ v.currentTime=P.ab.a; }
  });
  v.addEventListener("progress",()=>{ if(v.buffered.length){ buf.style.width=(v.buffered.end(v.buffered.length-1)/(v.duration||1)*100)+"%"; }});
  v.addEventListener("play",()=>{ playBtn.innerHTML=ICON_PAUSE; if(state.sync&&!state._syncing)syncAll("play",P); });
  v.addEventListener("pause",()=>{ playBtn.innerHTML=ICON_PLAY; if(state.sync&&!state._syncing)syncAll("pause",P); });

  playBtn.addEventListener("click",()=> v.paused? v.play():v.pause());
  q(".back").addEventListener("click",()=>{ v.currentTime=Math.max(0,v.currentTime-10); if(state.sync)syncAll("seek",P); });
  q(".fwd").addEventListener("click",()=>{ v.currentTime+=10; if(state.sync)syncAll("seek",P); });
  q(".fstep-b").addEventListener("click",()=>{ v.pause(); v.currentTime=Math.max(0,v.currentTime-1/30); });
  q(".fstep-f").addEventListener("click",()=>{ v.pause(); v.currentTime+=1/30; });

  muteBtn.addEventListener("click",()=>{ v.muted=!v.muted; muteBtn.innerHTML=v.muted?ICON_MUTE:ICON_VOL; });
  q(".vol").addEventListener("input",e=>{ v.volume=+e.target.value; v.muted=false; muteBtn.innerHTML=ICON_VOL; });
  q(".rate").addEventListener("change",e=>{ v.playbackRate=+e.target.value; });

  seek.addEventListener("click",e=>{ const r=seek.getBoundingClientRect(); v.currentTime=((e.clientX-r.left)/r.width)*v.duration; if(state.sync)syncAll("seek",P); });

  // A-B loop button cycles: set A -> set B -> clear
  q(".ab").addEventListener("click",()=>{
    const badge=q(".ab-badge");
    if(P.ab.a==null){ P.ab.a=v.currentTime; showHint("Bod <b>A</b> nastavený — klikni znova pre <b>B</b>"); }
    else if(P.ab.b==null){ P.ab.b=Math.max(v.currentTime,P.ab.a+0.3); badge.classList.add("on"); q(".ab").classList.add("on"); showHint("A-B loop aktívny 🔁"); }
    else { P.ab.a=P.ab.b=null; badge.classList.remove("on"); q(".ab").classList.remove("on"); abEl.style.display="none"; showHint("A-B loop zrušený"); }
    if(P.ab.a!=null&&v.duration){ abEl.style.display="block"; abEl.style.left=(P.ab.a/v.duration*100)+"%"; abEl.style.width=((( P.ab.b??v.currentTime)-P.ab.a)/v.duration*100)+"%"; }
  });

  q(".pip").addEventListener("click",()=>{ if(v!==document.pictureInPictureElement) v.requestPictureInPicture?.().catch(()=>{}); else document.exitPictureInPicture?.(); });
  q(".full").addEventListener("click",()=>{ p.requestFullscreen?.(); });
}

function loadIntoPanel(P, id, title){
  P.id=id; P.title=title||("Video "+id);
  P.video.src=STREAM(id);
  P.video.style.display="block";
  P.empty.style.display="none";
  P.controls.style.display="block";
  P.badgeT.style.display="block";
  P.badgeT.textContent=P.title;
  P.el.querySelector(".rate").value="1";
  P.video.playbackRate=1;
  P.ab={a:null,b:null};
  P.video.play().catch(()=>{});
  applyAudioFocus();
  saveToURL();
}

function clearPanel(P){
  P.video.pause(); P.video.removeAttribute("src"); P.video.load();
  P.id=null; P.title=null;
  P.video.style.display="none"; P.empty.style.display="flex";
  P.controls.style.display="none"; P.badgeT.style.display="none";
  saveToURL();
}

function setActive(idx){
  state.active=idx;
  state.panels.forEach(P=>P.el.classList.toggle("active",P.idx===idx));
}

/* ---------- audio focus ---------- */
function applyAudioFocus(){
  state.panels.forEach(P=>{
    if(!P.id){ return; }
    if(!state.audioFocus){ P.video.muted=false; P.el.classList.remove("audio-focus"); return; }
    const focused = (state.hoverIdx==null) ? (P.idx===state.active) : (P.idx===state.hoverIdx);
    P.video.muted = !focused;
    P.el.classList.toggle("audio-focus", focused && state.hoverIdx===P.idx);
  });
}

/* ---------- sync ---------- */
function syncAll(action, src){
  state._syncing=true;
  state.panels.forEach(P=>{
    if(P===src||!P.id) return;
    if(action==="play") P.video.play().catch(()=>{});
    else if(action==="pause") P.video.pause();
    else if(action==="seek") P.video.currentTime=src.video.currentTime;
  });
  setTimeout(()=>state._syncing=false,50);
}

/* ---------- URL persist ---------- */
function saveToURL(){
  const ids=state.panels.map(P=>P.id||"").join(",");
  const u=new URL(location);
  u.searchParams.set("l",state.layout);
  u.searchParams.set("v",ids);
  history.replaceState(null,"",u);
}
function loadFromURL(){
  const u=new URL(location);
  const l=+u.searchParams.get("l"); if([1,2,4,6].includes(l))state.layout=l;
  return (u.searchParams.get("v")||"").split(",");
}

/* ---------- library drawer ---------- */
function openDrawer(open){
  state.drawerOpen=open;
  $("#drawer").classList.toggle("open",open);
  $("#tgDrawer").classList.toggle("on",open);
  stage.classList.toggle("drawer-open",open);
}
async function loadLibrary(q=""){
  try{
    const r=await fetch(`${API_LIST}?page=1&per_page=60${q?`&search=${encodeURIComponent(q)}`:""}`);
    const data=await r.json();
    state.library=Array.isArray(data)?data:(data.videos||data.results||[]);
    renderLibrary();
  }catch(e){ $("#vlist").innerHTML=`<div style="color:var(--dim);padding:20px;text-align:center">Nepodarilo sa načítať knižnicu</div>`; }
}
function renderLibrary(){
  const list=$("#vlist");
  if(!state.library.length){ list.innerHTML=`<div style="color:var(--dim);padding:20px;text-align:center">Žiadne videá</div>`; return; }
  list.innerHTML="";
  state.library.forEach(v=>{
    const id=v.id, title=v.title||("Video "+id);
    const thumb=v.thumbnail_path||v.thumbnail||PLACEHOLDER;
    const src=(v.source_url||"").replace(/^https?:\/\//,"").split("/")[0]||"local";
    const c=document.createElement("div");
    c.className="vcard"; c.draggable=true;
    c.innerHTML=`<img class="thumb" src="${thumb}" onerror="this.src='${PLACEHOLDER}'"><div class="meta"><div class="ti">${title.replace(/</g,"&lt;")}</div><div class="su">${src} · ${fmt(v.duration||0)}</div></div>`;
    c.addEventListener("dragstart",e=>{ e.dataTransfer.setData("vid",id); e.dataTransfer.setData("vtitle",title); });
    c.addEventListener("click",()=>{ const P=state.panels[state.active]; loadIntoPanel(P,id,title); });
    list.appendChild(c);
  });
}

/* ---------- top bar controls ---------- */
$("#layouts").addEventListener("click",e=>{
  const b=e.target.closest(".lay-btn"); if(!b)return;
  document.querySelectorAll(".lay-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  state.layout=+b.dataset.l;
  if(state.active>=state.layout)state.active=0;
  buildStage(); saveToURL();
});
$("#tgAudio").addEventListener("click",function(){ state.audioFocus=!state.audioFocus; this.classList.toggle("on",state.audioFocus); applyAudioFocus(); });
$("#tgSync").addEventListener("click",function(){ state.sync=!state.sync; this.classList.toggle("on",state.sync); showHint(state.sync?"Sync zapnutý — play/seek ovláda všetky panely":"Sync vypnutý"); });
$("#tgDrawer").addEventListener("click",()=>openDrawer(!state.drawerOpen));

let searchT;
$("#vsearch").addEventListener("input",e=>{ clearTimeout(searchT); searchT=setTimeout(()=>loadLibrary(e.target.value.trim()),300); });

/* keyboard: space play/pause active, [ ] speed, , . frame step, m mute */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  const P=state.panels[state.active]; if(!P||!P.id)return; const v=P.video;
  if(e.code==="Space"){ e.preventDefault(); v.paused?v.play():v.pause(); }
  else if(e.key==="m"){ v.muted=!v.muted; }
  else if(e.key===","){ v.pause(); v.currentTime-=1/30; }
  else if(e.key==="."){ v.pause(); v.currentTime+=1/30; }
  else if(e.key==="ArrowLeft"){ v.currentTime-=5; if(state.sync)syncAll("seek",P); }
  else if(e.key==="ArrowRight"){ v.currentTime+=5; if(state.sync)syncAll("seek",P); }
});

/* ---------- init ---------- */
(function init(){
  const ids=loadFromURL();
  document.querySelectorAll(".lay-btn").forEach(b=>b.classList.toggle("active",+b.dataset.l===state.layout));
  buildStage();
  ids.forEach((id,i)=>{ if(id&&state.panels[i]) loadIntoPanel(state.panels[i],id,null); });
  loadLibrary();
  setTimeout(()=>showHint("Tip: hover nad panel = počuješ len jeho zvuk · <kbd>medzerník</kbd> play · <kbd>,</kbd> <kbd>.</kbd> snímka"),700);
})();
</script>
</body>
</html>
