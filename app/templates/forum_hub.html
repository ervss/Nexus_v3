<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
:root{
  --bg-1:#07131f; --bg-2:#0c2031;
  --panel:rgba(10,24,39,.92); --panel-soft:rgba(16,35,56,.86);
  --line:rgba(137,180,214,.16); --line-strong:rgba(115,207,197,.30);
  --text:#edf6ff; --muted:#8ea8c0;
  --accent:#56dec8; --accent-2:#7ec9ff; --hot:#ff3d9a; --hot-2:#b14dff;
  --ok:#39d98a; --warn:#ffbf5a; --bad:#ff7272;
  --shadow:0 24px 60px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Manrope',sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 12% 0%, rgba(255,61,154,.14), transparent 26%),
    radial-gradient(circle at 88% 6%, rgba(126,201,255,.13), transparent 26%),
    linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 48%,#091521 100%);
  background-attachment:fixed;
}
.material-icons-round{font-size:18px;line-height:1;vertical-align:-4px}
button{font-family:inherit;cursor:pointer}

/* ── top bar ─────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(7,19,31,.96),rgba(7,19,31,.78));
  border-bottom:1px solid var(--line);padding:14px 22px}
.topbar-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.3px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--hot);
  box-shadow:0 0 14px var(--hot),0 0 30px rgba(255,61,154,.6);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.82)}}
.brand small{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:1.4px;text-transform:uppercase}

.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 18px;border-radius:999px;
  font-weight:700;font-size:13px;transition:.18s}
.seg button.active{color:#04121b;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 18px rgba(86,222,200,.32)}

select,input[type=text],input[type=search]{background:rgba(255,255,255,.05);border:1px solid var(--line);
  color:var(--text);border-radius:12px;padding:9px 12px;font-family:inherit;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--line-strong)}
select option{background:#0c2031}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.05);color:var(--text);padding:9px 15px;font-weight:700;font-size:13px;transition:.18s}
.btn:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-hot{background:linear-gradient(135deg,var(--hot),var(--hot-2));border:0;color:#fff;
  box-shadow:0 8px 24px rgba(255,61,154,.34)}
.btn-hot:hover{box-shadow:0 12px 32px rgba(255,61,154,.5)}
.btn-go{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:0;color:#04121b;
  box-shadow:0 8px 22px rgba(86,222,200,.3)}
.btn-ghost{background:transparent}
.btn-danger{background:rgba(255,114,114,.14);border-color:rgba(255,114,114,.45);color:#ffc9c9}
.btn-danger:hover{background:rgba(255,114,114,.26);border-color:var(--bad)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);
  padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer}
.toggle:hover{border-color:var(--line-strong);color:var(--text)}
.toggle input{accent-color:var(--accent);cursor:pointer;margin:0}

.spacer{flex:1}
.counter{font-weight:800;font-size:13px;padding:7px 13px;border-radius:999px;
  background:rgba(255,61,154,.14);border:1px solid rgba(255,61,154,.35);color:#ffa8d2}

/* ── tag bar ─────────────────────────────────────────── */
.tagbar{display:none;margin-top:14px;padding:14px;border-radius:18px;
  background:var(--panel-soft);border:1px solid var(--line)}
.tagbar.visible{display:block}
.tagbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tagbar-label{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;min-width:260px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;
  background:rgba(86,222,200,.12);border:1px solid rgba(86,222,200,.35);color:#b6f4e8}
.chip button{background:none;border:0;color:inherit;opacity:.7;padding:0;display:flex}
.chip button:hover{opacity:1;color:var(--bad)}
.tag-input-wrap{position:relative;min-width:200px;flex:1}
.tag-input-wrap input{width:100%}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;max-height:260px;overflow:auto;
  background:#0b1e30;border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);display:none}
.suggest.visible{display:block}
.suggest div{padding:9px 13px;font-size:13px;display:flex;justify-content:space-between;gap:10px}
.suggest div:hover,.suggest div.active{background:rgba(86,222,200,.14);color:#b6f4e8}
.suggest span{color:var(--muted);font-size:11px;font-weight:700}

.channels{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.channel{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;
  background:rgba(177,77,255,.12);border:1px solid rgba(177,77,255,.35);color:#dcc0ff;cursor:pointer;transition:.16s}
.channel:hover{background:rgba(177,77,255,.22);transform:translateY(-1px)}
.channel button{background:none;border:0;color:inherit;opacity:.6;display:flex;padding:0}
.channel button:hover{color:var(--bad);opacity:1}

/* ── layout ──────────────────────────────────────────── */
.wrap{padding:24px 22px 140px;max-width:1900px;margin:0 auto}

.banner{display:none;align-items:flex-start;gap:12px;padding:16px 18px;border-radius:16px;margin-bottom:20px;
  background:rgba(255,114,114,.10);border:1px solid rgba(255,114,114,.4);color:#ffc9c9;font-size:13px;line-height:1.6}
.banner.visible{display:flex}
.banner.cool{background:rgba(255,176,32,.10);border-color:rgba(255,176,32,.45);color:#ffd89a}
.banner code{background:rgba(0,0,0,.35);padding:2px 6px;border-radius:5px;font-size:12px}
.auth-chip{margin-left:10px;font-size:11px;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.auth-chip.ok{color:#7ef2b8;border-color:rgba(57,217,138,.45);background:rgba(57,217,138,.12)}
.auth-chip.bad{color:#ffb4b4;border-color:rgba(255,114,114,.45);background:rgba(255,114,114,.12)}
.auth-chip.wait{color:#ffd89a;border-color:rgba(255,176,32,.45);background:rgba(255,176,32,.12)}

/* ── thread section ──────────────────────────────────── */
.thread{margin-bottom:34px;border-radius:22px;background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--shadow);overflow:hidden}
.thread-head{display:flex;align-items:center;gap:14px;padding:16px 20px;flex-wrap:wrap;cursor:pointer;
  background:linear-gradient(90deg,rgba(255,61,154,.10),rgba(126,201,255,.06) 60%,transparent);
  border-bottom:1px solid var(--line);transition:background .18s;user-select:none}
.thread-head:hover{background:linear-gradient(90deg,rgba(255,61,154,.16),rgba(126,201,255,.09) 60%,transparent)}
.thread-head a,.thread-head button{cursor:pointer}
.chev{color:var(--muted);transition:transform .22s}
.thread.collapsed .chev{transform:rotate(-90deg)}
.thread.collapsed .grid{display:none}
.thread.collapsed .thread-head{border-bottom:0}
.hidden-count{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;
  background:rgba(126,201,255,.14);border:1px solid rgba(126,201,255,.32);color:#bfe3ff}
.verified-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;
  padding:4px 10px;border-radius:999px;background:rgba(57,217,138,.12);
  border:1px solid rgba(57,217,138,.3);color:#7ef2b8}
.verified-pill .material-icons-round{font-size:13px}
.thread-title{font-size:18px;font-weight:800;letter-spacing:.2px;margin:0;display:flex;align-items:center;gap:10px}
.thread-title a{color:var(--text);text-decoration:none}
.thread-title a:hover{color:var(--accent)}
.board-badge{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  padding:4px 9px;border-radius:6px;color:#04121b}
.origin-badge{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:6px;
  background:rgba(177,77,255,.16);border:1px solid rgba(177,77,255,.4);color:#dcc0ff}
.thread-meta{font-size:12px;color:var(--muted);font-weight:600}
.new-pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;
  background:linear-gradient(135deg,var(--hot),var(--hot-2));color:#fff;box-shadow:0 0 16px rgba(255,61,154,.5)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px;padding:20px}

/* ── card ────────────────────────────────────────────── */
.card{position:relative;border-radius:18px;overflow:hidden;background:var(--panel-soft);
  border:1px solid var(--line);transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:var(--line-strong);
  box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 1px rgba(86,222,200,.16)}
.card.selected{border-color:var(--hot);box-shadow:0 0 0 2px rgba(255,61,154,.45),0 18px 44px rgba(0,0,0,.5)}
.card.imported{opacity:.5}
.card.dead .thumb{filter:grayscale(1) brightness(.5)}
.card.enriching::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;
  background:linear-gradient(100deg,transparent 35%,rgba(86,222,200,.16) 50%,transparent 65%);
  background-size:220% 100%;animation:sk 1.1s infinite}

.thumb{position:relative;aspect-ratio:16/10;background:#08151f;overflow:hidden;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;transition:.35s}
.card:hover .thumb img{transform:scale(1.06)}
.thumb-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#2f4a63}
.thumb-empty .material-icons-round{font-size:46px}

.play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(0,0,0,.35),rgba(0,0,0,.7));opacity:0;transition:.2s}
.card:hover .play-overlay{opacity:1}
.play-overlay .material-icons-round{font-size:40px;color:#fff;
  background:linear-gradient(135deg,var(--hot),var(--hot-2));border-radius:50%;padding:12px;
  box-shadow:0 0 30px rgba(255,61,154,.7)}

.plat{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  padding:5px 9px;border-radius:7px;background:rgba(4,18,27,.86);backdrop-filter:blur(6px);border:1px solid var(--line-strong)}
.sel-box{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:8px;cursor:pointer;
  background:rgba(4,18,27,.8);border:1.5px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;
  transition:.16s;backdrop-filter:blur(6px)}
.sel-box:hover{border-color:var(--hot)}
.sel-box .material-icons-round{font-size:17px;opacity:0;color:#fff}
.card.selected .sel-box{background:linear-gradient(135deg,var(--hot),var(--hot-2));border-color:transparent}
.card.selected .sel-box .material-icons-round{opacity:1}

.badges{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;backdrop-filter:blur(6px);
  background:rgba(4,18,27,.84);border:1px solid var(--line)}
.badge.q{color:#04121b;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:0}
.badge.fresh{color:#fff;background:linear-gradient(135deg,var(--hot),var(--hot-2));border:0}

.body{padding:13px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.title{font-size:13.5px;font-weight:700;line-height:1.35;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;color:#b6f4e8;
  background:rgba(86,222,200,.10);border:1px solid rgba(86,222,200,.22)}
.byline{font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;margin-top:auto}
.byline .material-icons-round{font-size:13px}

/* 1:2:2 keeps the 20/40/40 split intact once the gaps are subtracted. */
.actions{display:grid;grid-template-columns:1fr 2fr 2fr;gap:6px;padding:0 14px 14px}
.actions .btn{justify-content:center;padding:8px 6px;font-size:12px;border-radius:10px;min-width:0}
.actions .btn-icon{padding:8px 0}
.actions .btn-icon .material-icons-round{font-size:17px}

.status-line{font-size:11px;font-weight:700;padding:0 14px 12px;color:var(--muted);
  display:flex;align-items:center;gap:5px}
.status-line .material-icons-round{font-size:14px}
.status-line.dead{color:var(--bad)}
.status-line.imported{color:var(--ok)}
.status-line.ok{color:var(--accent)}
.status-line.pending{color:#6d8aa3}

.verified-tick{position:absolute;top:10px;right:44px;width:26px;height:26px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
  background:rgba(57,217,138,.22);border:1px solid rgba(57,217,138,.5)}
.verified-tick .material-icons-round{font-size:16px;color:#7ef2b8}
.card.verified{border-color:rgba(57,217,138,.28)}
.card:not(.verified) .thumb-empty{opacity:.55}

/* ── selection bar ───────────────────────────────────── */
.selbar{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);z-index:70;
  display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:18px;
  background:rgba(9,22,36,.96);border:1px solid var(--line-strong);box-shadow:var(--shadow);
  backdrop-filter:blur(16px);transition:transform .28s cubic-bezier(.2,.9,.3,1.2)}
.selbar.visible{transform:translate(-50%,0)}
.selbar b{font-size:15px;color:var(--hot)}

.workbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px;
  padding:10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.workbar .work-counts{display:flex;gap:6px;flex-wrap:wrap;margin-right:6px}
.work-pill{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.work-pill b{color:var(--text);margin-right:4px}
.work-pill.dead{color:#ffc9c9;border-color:rgba(255,114,114,.4);background:rgba(255,114,114,.1)}
.work-pill.pending{color:#ffd89a;border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.08)}
.work-pill.ok{color:#7ef2b8;border-color:rgba(57,217,138,.35);background:rgba(57,217,138,.1)}
.workbar .btn{padding:7px 12px;font-size:12px;border-radius:10px}
.work-sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.dead-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;
  padding:4px 10px;border-radius:999px;background:rgba(255,114,114,.12);
  border:1px solid rgba(255,114,114,.35);color:#ffc9c9}

/* ── activity panel ──────────────────────────────────── */
.activity{position:fixed;left:22px;bottom:22px;z-index:65;width:min(430px,calc(100vw - 44px));
  padding:13px 15px 11px;border-radius:16px;background:rgba(9,22,36,.97);border:1px solid var(--line-strong);
  box-shadow:var(--shadow);backdrop-filter:blur(16px);
  transform:translateY(160%);transition:transform .28s cubic-bezier(.2,.9,.3,1.2)}
.activity.visible{transform:translateY(0)}
.act-row{display:flex;align-items:center;gap:11px}
.act-icon{color:var(--accent);animation:pulse 1.6s infinite}
.act-text{flex:1;min-width:0}
.act-title{font-size:13px;font-weight:800}
.act-detail{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-count{font-size:12px;font-weight:800;color:var(--accent);white-space:nowrap}
.act-row .btn{padding:6px 11px;font-size:12px;border-radius:9px}
.act-track{margin-top:10px;height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.act-fill{height:100%;border-radius:99px;transition:width .3s ease;
  background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--hot));background-size:200% 100%}
.act-fill.indeterminate{animation:slide-x 1.2s infinite linear}
@keyframes slide-x{to{background-position:-200% 0}}

/* ── player ──────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(3,9,15,.9);backdrop-filter:blur(8px);padding:24px}
.modal.visible{display:flex}
.modal-inner{width:min(1180px,100%);border-radius:22px;overflow:hidden;background:#07131f;
  border:1px solid var(--line-strong);box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:15px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.surface{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}
.surface video,.surface iframe{width:100%;height:100%;border:0;display:block}
.surface .empty{color:var(--muted);font-size:14px;padding:24px;text-align:center;line-height:1.6}

.empty-state{text-align:center;padding:90px 20px;color:var(--muted)}
.empty-state .material-icons-round{font-size:60px;opacity:.3;margin-bottom:14px}
.empty-state h2{color:var(--text);font-size:20px;margin:0 0 8px}
.empty-state p{margin:0;font-size:14px;line-height:1.7}

.toast{position:fixed;right:22px;bottom:22px;z-index:120;display:flex;flex-direction:column;gap:10px}
.toast div{padding:13px 17px;border-radius:14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);
  background:#0b1e30;border:1px solid var(--line-strong);animation:slide .3s}
.toast .ok{border-color:rgba(57,217,138,.5);color:#a7f3d0}
.toast .bad{border-color:rgba(255,114,114,.5);color:#ffc9c9}
@keyframes slide{from{transform:translateX(30px);opacity:0}}

.skeleton{border-radius:18px;height:300px;background:linear-gradient(100deg,rgba(255,255,255,.03) 30%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.03) 70%);
  background-size:220% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-220% 0}}
</style>
<script src="/static/playback_activity.js?v=20260930_activity_3" defer></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <a class="btn btn-ghost" href="/" title="Späť na dashboard" style="padding:9px 11px">
      <span class="material-icons-round">arrow_back</span></a>
    <div class="brand"><span class="dot"></span>FORUM HUB <small id="brandSub">simpcity</small>
      <span class="auth-chip" id="authChip">…</span></div>

    <div class="seg" id="modeSeg">
      <button data-mode="watched" class="active"><span class="material-icons-round">visibility</span> Sledované</button>
      <button data-mode="tag"><span class="material-icons-round">sell</span> Podľa tagov</button>
    </div>
    <a class="btn btn-go" href="/forum/new" title="Jeden feed všetkého nového">
      <span class="material-icons-round">bolt</span> Čo je nové</a>
    <a class="btn btn-ghost" href="/forum/groups" title="Kurátorské skupiny (deepthroat, fake tits, bimbo)">
      <span class="material-icons-round">grid_view</span> Skupiny</a>

    <select id="boardSel"></select>
    <select id="statusSel">
      <option value="active">Aktívne</option>
      <option value="new">Len neoverené</option>
      <option value="resolved">Len overené</option>
      <option value="dead">Mŕtve</option>
      <option value="imported">Importované</option>
      <option value="dismissed">Skryté</option>
      <option value="all">Všetko</option>
    </select>
    <select id="platformSel"><option value="">Všetky platformy</option></select>

    </label>

      <button class="btn btn-ghost" id="saveBtn"><span class="material-icons-round">star</span> Uložiť kanál</button>
    </div>
    <div class="channels" id="channels"></div>

</div>

<div class="wrap">
  <div class="banner" id="banner">
    <span class="material-icons-round">key_off</span>
    <div id="bannerText"></div>
  </div>
  <div class="workbar" id="workbar" hidden>
    <div class="work-counts" id="workCounts"></div>
    <span class="work-sep"></span>
    <button class="btn btn-ghost" id="selAllBtn" title="Označí všetky karty v aktuálnom náhľade">
      <span class="material-icons-round">select_all</span> Vybrať zobrazené</button>
    <button class="btn btn-ghost" id="selDeadBtn" title="Označí mŕtve karty vo všetkých threadoch">
      <span class="material-icons-round">link_off</span> Vybrať mŕtve</button>

      <span class="material-icons-round">hourglass_empty</span> Neoverené</button>
    <button class="btn btn-ghost" id="selOkBtn">
      <span class="material-icons-round">verified</span> Overené</button>
    <span class="work-sep"></span>
    <button class="btn btn-danger" id="purgeDeadBtn" title="Zmaže všetky mŕtve v tomto board/režime, aj tie mimo 24 kariet na thread">
      <span class="material-icons-round">delete_sweep</span> Vymazať všetky mŕtve</button>
  </div>
  <div id="feed"></div>
</div>

<div class="activity" id="activity">
  <div class="act-row">
    <span class="material-icons-round act-icon">bolt</span>
    <div class="act-text">
      <div class="act-title" id="actTitle"></div>
      <div class="act-detail" id="actDetail"></div>

  <div class="act-track"><div class="act-fill" id="actFill"></div></div>

<div class="selbar" id="selbar">
  <b id="selCount">0</b><span>vybraných</span>
  <button class="btn" id="resolveSel"><span class="material-icons-round">bolt</span> Overiť</button>
  <button class="btn btn-go" id="importSel"><span class="material-icons-round">download</span> Import</button>
  <button class="btn btn-ghost" id="dismissSel"><span class="material-icons-round">visibility_off</span> Skryť</button>
  <button class="btn btn-danger" id="deleteSel"><span class="material-icons-round">delete</span> Vymazať</button>
  <button class="btn btn-ghost" id="clearSel"><span class="material-icons-round">close</span></button>

<div class="modal" id="player">
  <div class="modal-inner">
    <div class="modal-head">
      <h3 id="playerTitle"></h3>
      <a class="btn btn-ghost" id="playerSource" target="_blank" rel="noreferrer">
        <span class="material-icons-round">open_in_new</span> Zdroj</a>
      <button class="btn btn-ghost" id="playerClose"><span class="material-icons-round">close</span></button>
    </div>
    <div class="surface" id="surface"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/hls.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = async (url, opts) => {
  const r = await fetch(url, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
  return body;
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = {
  mode: 'watched', board: 'simpcity', status: 'active', platform: '', q: '',
  sort: 'newest', minHeight: 0, minSizeMb: 0, minDuration: 0, onlyComplete: false,
  tags: [], threads: [], selected: new Set(), boards: [], busy: false,
  collapsed: new Set(), counts: {dead:0,new:0,resolved:0,imported:0,dismissed:0},
};

function toast(msg, kind = 'ok') {
  const el = document.createElement('div');
  el.className = kind;
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

const fmtSize = b => !b ? '' : b >= 1073741824 ? (b/1073741824).toFixed(2)+' GB' : (b/1048576).toFixed(0)+' MB';
const fmtDur = s => !s ? '' : (s >= 3600
  ? `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`
  : `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`);
const ago = iso => {
  if (!iso) return '';
  const h = (Date.now() - new Date(iso + 'Z').getTime()) / 36e5;
  if (h < 1) return 'pred chvíľou';
  if (h < 24) return `pred ${Math.round(h)} h`;
  const d = Math.round(h / 24);
  return d < 30 ? `pred ${d} d` : new Date(iso).toLocaleDateString('sk');
};
const thumbUrl = (t, ref) => t ? `/api/tester/thumb?url=${encodeURIComponent(t)}&referer=${encodeURIComponent(ref||'')}` : '';
const isFresh = iso => iso && (Date.now() - new Date(iso + 'Z').getTime()) < 864e5 * 2;

/* ── boards / banner ───────────────────────────────── */
async function loadBoards() {
  const data = await api('/api/forum/boards');
  state.boards = data.boards;
  $('#boardSel').innerHTML = data.boards
    .map(b => `<option value="${b.board}">${esc(b.label)}${b.authenticated ? '' : ' ⚠'}</option>`).join('');
  $('#boardSel').value = state.board;
  $('#platformSel').innerHTML = '<option value="">Všetky platformy</option>' +
    data.platforms.map(p => `<option value="${p}">${p}</option>`).join('');
  checkAuth();
}

function checkAuth() {
  const b = state.boards.find(x => x.board === state.board);
  $('#brandSub').textContent = b ? b.label.toLowerCase() : state.board;
  const banner = $('#banner');
  const chip = $('#authChip');
  const cool = Math.round(b && b.cooldown_seconds ? b.cooldown_seconds : 0);
  const authState = b ? b.auth_state : 'unchecked';
  const authenticated = authState === 'authenticated';
  const waiting = authState === 'rate_limited' || cool > 0;
  const labels = {
    authenticated: 'prihlásené',
    unchecked: 'neoverené',
    missing_cookies: 'chýbajú cookies',
    expired: 'session expirovala',
    ddos_guard: 'DDoS-Guard',
    rate_limited: `počká ${cool}s`,
    error: 'chyba spojenia'
  };
  if (chip) {
    chip.className = 'auth-chip ' + (authenticated && !waiting ? 'ok' : waiting ? 'wait' : 'bad');
    chip.textContent = cool > 0 ? `počká ${cool}s` : labels[authState] || 'neoverené';
  }
  if (!authenticated) {
    const messages = {
      unchecked: 'Prihlásenie ešte nebolo overené. Spusti Refresh na kontrolu spojenia.',
      missing_cookies: 'Chýbajú prihlasovacie cookies. Synchronizuj ich cez rozšírenie prehliadača.',
      expired: 'Fórum odmietlo session cookies. Znova sa prihlás a synchronizuj cookies.',
      ddos_guard: 'Fórum vrátilo ochrannú výzvu DDoS-Guard. Skús to neskôr.',
      rate_limited: `Fórum obmedzilo požiadavky. Obnovovanie počká ${cool}s.`,
      error: b && b.auth_error ? b.auth_error : 'Spojenie s fórom zlyhalo.'
    };
    $('#bannerText').innerHTML =
      `<b>${esc(b ? b.label : state.board)}: ${esc(labels[authState] || 'neoverené')}.</b><br>` +
      esc(messages[authState] || messages.unchecked);
    banner.className = `banner visible${waiting ? ' cool' : ''}`;
  } else if (cool) {
    $('#bannerText').innerHTML =
      `<b>${esc(b.label)} práve throttle-uje (HTTP 429).</b><br>` +
      `Hub počká ${cool}s a potom číta thready po jednom. Neklikaj Refresh dokola — to to len zhorší.`;
    banner.className = 'banner visible cool';
  } else {
    banner.classList.remove('visible');
    banner.classList.remove('cool');
  }
}

/* ── feed ──────────────────────────────────────────── */
async function loadFeed() {
  const p = new URLSearchParams({ board: state.board, status: state.status, sort: state.sort });
  if (state.mode === 'tag') p.set('origin', 'tag');
  if (state.mode === 'watched') p.set('origin', 'watched');
  if (state.platform) p.set('platform', state.platform);
  if (state.q) p.set('q', state.q);
  if (state.minHeight) p.set('min_height', state.minHeight);
  if (state.minSizeMb) p.set('min_size_mb', state.minSizeMb);
  if (state.minDuration) p.set('min_duration', state.minDuration);
  if (state.onlyComplete) p.set('only_complete', 'true');

  $('#feed').innerHTML = `<div class="grid">${'<div class="skeleton"></div>'.repeat(8)}</div>`;
  try {
    const data = await api('/api/forum/feed?' + p);
    state.threads = data.threads;
    state.counts = data.counts || {dead:0,new:0,resolved:0,imported:0,dismissed:0};
    $('#counter').textContent = `${data.total_links} liniek`;
    renderWorkbar();
    render();
  } catch (e) {
    $('#feed').innerHTML = '';
    toast(e.message, 'bad');
  }
}

function render() {
  const feed = $('#feed');
  if (!state.threads.length) {
    const filtered = state.minHeight || state.minSizeMb || state.minDuration || state.onlyComplete;
    feed.innerHTML = `<div class="empty-state">
      <span class="material-icons-round">${filtered ? 'filter_alt_off' : 'inbox'}</span>
      <h2>${filtered ? 'Filtre nič nenašli' : 'Zatiaľ nič'}</h2>
      <p>${filtered
        ? 'Karty, ktoré ešte neprešli overením, majú veľkosť aj dĺžku nulovú, takže ich filter vyradí.<br>Počkaj, kým dobehne fronta vľavo dole, alebo filter zmierni.'
        : state.mode === 'watched'
          ? 'Klikni na <b>Refresh</b> a stiahnem nové posty zo sledovaných threadov.'
          : 'Pridaj tagy a klikni na <b>Hľadať</b>.'}</p></div>`;
    renderWorkbar();
    return;
  }
  feed.innerHTML = state.threads.map(threadHtml).join('');
  syncSelection();
  buildQueue();
}

function threadHtml(t) {
  const collapsed = state.collapsed.has(t.id);
  const dead = t.links.filter(l => l.status === 'dead').length;
  return `<section class="thread ${collapsed ? 'collapsed' : ''}" data-thread="${t.id}">
    <div class="thread-head" onclick="onHeadClick(event, ${t.id})" title="Klikni pre zbalenie / rozbalenie">
      <span class="material-icons-round chev">expand_more</span>
      <h2 class="thread-title">
        <span class="board-badge" style="background:${t.board_color}">${esc(t.board_label)}</span>
        <a href="${esc(t.url)}" target="_blank" rel="noreferrer">${esc(t.title)}</a>
      </h2>
      ${t.origin === 'tag' ? `<span class="origin-badge">tag: ${esc(t.discovered_via)}</span>` : ''}
      ${t.new_count ? `<span class="new-pill">${t.new_count} nových</span>` : ''}
      ${dead ? `<span class="dead-pill"><span class="material-icons-round" style="font-size:13px">link_off</span> ${dead} mŕtvych</span>` : ''}
      <span class="verified-pill">
        <span class="material-icons-round">verified</span>
        ${t.links.filter(l => l.resolved).length} / ${t.links.length} overených</span>
      ${collapsed ? `<span class="hidden-count">${t.links.length} kariet skrytých</span>` : ''}
      <span class="thread-meta">${ago(t.last_post_at)}</span>
      <div class="spacer"></div>
      ${dead ? `<button class="btn btn-ghost" onclick="selectThreadBy(${t.id}, l => l.status === 'dead')">
        <span class="material-icons-round">link_off</span> Vybrať mŕtve</button>` : ''}
      <button class="btn btn-ghost" onclick="selectThread(${t.id})">
        <span class="material-icons-round">select_all</span> Vybrať všetko</button>
      <button class="btn btn-ghost" onclick="markSeen(${t.id})">
        <span class="material-icons-round">done_all</span> Označiť prečítané</button>
    </div>
    <div class="grid">${t.links.map(cardHtml).join('')}</div>
  </section>`;
}

/* ── collapse ──────────────────────────────────────────
   Clicking the header folds the thread away. The cards stay in the DOM, so the
   enrich queue keeps filling them in while they're hidden. */
function onHeadClick(event, tid) {
  // The title links out to the forum and the buttons act on the thread.
  if (event.target.closest('a, button')) return;
  toggleThread(tid);
}

function toggleThread(tid) {
  state.collapsed.has(tid) ? state.collapsed.delete(tid) : state.collapsed.add(tid);
  saveCollapsed();

  const section = document.querySelector(`.thread[data-thread="${tid}"]`);
  const thread = state.threads.find(t => t.id === tid);
  if (!section || !thread) return;
  section.outerHTML = threadHtml(thread);
  syncSelection();
}

function saveCollapsed() {
  try { localStorage.setItem('forumHub.collapsed', JSON.stringify([...state.collapsed])); } catch {}
}

function loadCollapsed() {
  try { return new Set(JSON.parse(localStorage.getItem('forumHub.collapsed') || '[]')); }
  catch { return new Set(); }
}

function setAllCollapsed(on) {
  state.collapsed = on ? new Set(state.threads.map(t => t.id)) : new Set();
  saveCollapsed();
  render();
}

function cardHtml(l) {
  const thumb = l.thumbnail ? thumbUrl(l.thumbnail, l.url) : '';
  const badges = [
    l.quality && `<span class="badge q">${esc(l.quality)}</span>`,
    l.size_bytes && `<span class="badge">${fmtSize(l.size_bytes)}</span>`,
    l.duration && `<span class="badge">${fmtDur(l.duration)}</span>`,
    l.item_count && `<span class="badge">${l.item_count} súborov</span>`,
    isFresh(l.posted_at) && `<span class="badge fresh">NOVÉ</span>`,
  ].filter(Boolean).join('');

  const statusLine = l.status === 'dead'
    ? `<div class="status-line dead"><span class="material-icons-round">link_off</span> Mŕtvy odkaz</div>`
    : l.status === 'imported'
      ? `<div class="status-line imported"><span class="material-icons-round">check_circle</span> Importované</div>`
      : l.resolved
        ? `<div class="status-line ok"><span class="material-icons-round">verified</span> Overené — metadáta z hostiteľa</div>`
        : `<div class="status-line pending"><span class="material-icons-round">hourglass_empty</span> Čaká na overenie</div>`;

  return `<article class="card ${state.selected.has(l.id) ? 'selected' : ''} ${l.status} ${l.resolved ? 'verified' : ''}" data-id="${l.id}">
    <div class="thumb" onclick="play(${l.id})">
      ${thumb
        ? `<img loading="lazy" src="${esc(thumb)}" onerror="this.parentElement.innerHTML='<div class=thumb-empty><span class=material-icons-round>broken_image</span></div>'">`
        : `<div class="thumb-empty"><span class="material-icons-round">movie</span></div>`}
      <div class="play-overlay"><span class="material-icons-round">play_arrow</span></div>
      <span class="plat">${esc(l.platform)} · ${esc(l.link_type)}</span>
      ${l.resolved ? `<span class="verified-tick" title="Overené"><span class="material-icons-round">verified</span></span>` : ''}
      <div class="badges">${badges}</div>
    </div>
    <div class="sel-box" onclick="event.stopPropagation();toggleSel(${l.id})">
      <span class="material-icons-round">check</span></div>
    <div class="body">
      <div class="title">${esc(l.title)}</div>
      ${l.tags.length ? `<div class="tags">${l.tags.slice(0,4).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="byline"><span class="material-icons-round">person</span>${esc(l.author || 'neznámy')}
        · ${ago(l.posted_at)}</div>
    </div>
    ${statusLine}
    <div class="actions">
      <a class="btn btn-icon" href="${esc(l.url)}" target="_blank" rel="noreferrer" title="Otvoriť zdroj">
        <span class="material-icons-round">open_in_new</span></a>
      <button class="btn btn-hot" onclick="play(${l.id})">
        <span class="material-icons-round">play_arrow</span> Prehrať</button>
      <button class="btn btn-go" onclick="importOne(${l.id})">
        <span class="material-icons-round">download</span> Import</button>
    </div>
  </article>`;
}

const findLink = id => state.threads.flatMap(t => t.links).find(l => l.id === id);

/* ── enrich queue ──────────────────────────────────────
   Post text almost never carries size/duration, so a card is incomplete until the
   resolver has probed it. Walk every incomplete card in the current view as a
   pausable queue, in small batches, so the hosts aren't hammered all at once. */
const BATCH = 3;

const enrich = {
  ids: [], idx: 0, running: false, paused: false, label: '', current: [],
};

const needsEnrich = l => !l.resolved && l.status !== 'dead' && l.status !== 'imported';

function buildQueue() {
  const pending = state.threads.flatMap(t => t.links).filter(needsEnrich).map(l => l.id);
  enrich.ids = pending;
  enrich.idx = 0;
  enrich.current = [];
  renderActivity();
  if (pending.length && !enrich.paused) runQueue();
}

async function runQueue() {
  if (enrich.running || enrich.paused) return;
  enrich.running = true;

  while (enrich.idx < enrich.ids.length && !enrich.paused) {
    const batch = enrich.ids.slice(enrich.idx, enrich.idx + BATCH);
    enrich.current = batch.map(id => findLink(id)?.title || `#${id}`);
    renderActivity();
    batch.forEach(id => document.querySelector(`.card[data-id="${id}"]`)?.classList.add('enriching'));

    try {
      const res = await api('/api/forum/links/resolve', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ link_ids: batch }),
      });
      res.results.forEach(fresh => {
        const link = findLink(fresh.id);
        if (link) Object.assign(link, fresh);
        replaceCard(fresh.id);
      });
    } catch (e) {
      batch.forEach(id => document.querySelector(`.card[data-id="${id}"]`)?.classList.remove('enriching'));
      // A failed batch must still advance, or the queue spins on it forever.
    }
    enrich.idx += batch.length;
    updateThreadPills();
    renderActivity();
  }

  enrich.running = false;
  enrich.current = [];
  renderActivity();
}

function pauseQueue() { enrich.paused = true; renderActivity(); }
function resumeQueue() { enrich.paused = false; renderActivity(); runQueue(); }

function replaceCard(id) {
  const el = document.querySelector(`.card[data-id="${id}"]`);
  const link = findLink(id);
  if (el && link) el.outerHTML = cardHtml(link);
}

/** Cards are swapped in place, so the header's "x / y overených" needs its own refresh. */
function updateThreadPills() {
  state.threads.forEach(t => {
    const pill = document.querySelector(`.thread[data-thread="${t.id}"] .verified-pill`);
    if (!pill) return;
    const done = t.links.filter(l => l.resolved).length;
    pill.innerHTML = `<span class="material-icons-round">verified</span> ${done} / ${t.links.length} overených`;
  });
}

/* ── activity panel ────────────────────────────────── */
function setActivity(label) {
  enrich.label = label;
  renderActivity();
}

function renderActivity() {
  const bar = $('#activity');
  const total = enrich.ids.length;
  const done = Math.min(enrich.idx, total);
  const busy = enrich.label || (total && done < total);

  if (!busy) { bar.classList.remove('visible'); return; }
  bar.classList.add('visible');

  if (enrich.label) {
    $('#actTitle').textContent = enrich.label;
    $('#actDetail').textContent = '';
    $('#actCount').textContent = '';
    $('#actFill').style.width = '100%';
    $('#actFill').classList.add('indeterminate');
    $('#actPause').style.display = 'none';
    return;
  }

  const pct = total ? Math.round(done / total * 100) : 0;
  $('#actFill').classList.remove('indeterminate');
  $('#actFill').style.width = pct + '%';
  $('#actCount').textContent = `${done} / ${total} · ${pct}%`;
  $('#actTitle').textContent = enrich.paused ? 'Overovanie pozastavené'
    : (done >= total ? 'Hotovo — všetky karty majú metadáta' : 'Overujem metadáta');
  $('#actDetail').textContent = enrich.paused ? `Pokračuje sa od ${done + 1}.`
    : (enrich.current[0] || '');

  const btn = $('#actPause');
  btn.style.display = done >= total ? 'none' : 'inline-flex';
  btn.innerHTML = enrich.paused
    ? '<span class="material-icons-round">play_arrow</span> Pokračovať'
    : '<span class="material-icons-round">pause</span> Pauza';
  btn.onclick = enrich.paused ? resumeQueue : pauseQueue;
}

/* ── selection ─────────────────────────────────────── */
function toggleSel(id) {
  state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
  syncSelection();
}
function selectThread(tid) {
  const t = state.threads.find(x => x.id === tid);
  const all = t.links.every(l => state.selected.has(l.id));
  t.links.forEach(l => all ? state.selected.delete(l.id) : state.selected.add(l.id));
  syncSelection();
}
function selectThreadBy(tid, pred) {
  const t = state.threads.find(x => x.id === tid);
  if (!t) return;
  t.links.filter(pred).forEach(l => state.selected.add(l.id));
  syncSelection();
}
const visibleLinks = () => state.threads.flatMap(t => t.links);
function selectWhere(pred) {
  visibleLinks().filter(pred).forEach(l => state.selected.add(l.id));
  syncSelection();
}
function renderWorkbar() {
  const bar = $('#workbar');
  const c = state.counts || {};
  const has = state.threads.length > 0;
  bar.hidden = !has;
  if (!has) return;
  $('#workCounts').innerHTML =
    `<span class="work-pill dead"><b>${c.dead || 0}</b> mŕtvych</span>` +
    `<span class="work-pill pending"><b>${c.new || 0}</b> neoverených</span>` +
    `<span class="work-pill ok"><b>${c.resolved || 0}</b> overených</span>`;
  $('#purgeDeadBtn').disabled = !(c.dead > 0);
  $('#selDeadBtn').disabled = !(c.dead > 0);
}
function currentOrigin() {
  return state.mode === 'tag' ? 'tag' : state.mode === 'watched' ? 'watched' : '';
}
async function purgeStatus(status) {
  const n = state.counts?.[status] || 0;
  if (!n) return toast('Nič na zmazanie.', 'bad');
  const label = status === 'dead' ? 'mŕtvych' : status === 'imported' ? 'importovaných' : 'skrytých';
  if (!confirm(`Vymazať všetkých ${n} ${label} odkazov v tomto pohľade?\nPlatí pre ${state.board}${currentOrigin() ? ' / ' + currentOrigin() : ''}, aj karty mimo zobrazených 24 na thread.`)) return;
  try {
    const res = await api('/api/forum/links/purge', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ status, board: state.board, origin: currentOrigin() }),
    });
    toast(`${res.deleted} ${label} vymazaných`);
    state.selected.clear();
    loadFeed();
  } catch (e) { toast(e.message, 'bad'); }
}
function syncSelection() {
  document.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('selected', state.selected.has(+c.dataset.id)));
  $('#selCount').textContent = state.selected.size;
  $('#selbar').classList.toggle('visible', state.selected.size > 0);
}

/* ── actions ───────────────────────────────────────── */

/** Hosts that only play inside their own iframe. Returns the embed URL, or ''. */
function embedUrlFor(l) {
  const m = l.url.match(/turbo\.cr\/(?:embed|e|v|d|f)\/([^/?#]+)/i);
  if (m) return `https://turbo.cr/embed/${encodeURIComponent(m[1])}`;
  if (/\/embed\//i.test(l.url)) return l.url;
  return '';
}

let forumHls = null;
function disposeForumHls() {
  if (forumHls) { forumHls.destroy(); forumHls = null; }
}

function showVideo(src, isHls) {
  disposeForumHls();
  $('#surface').innerHTML = '<video id="forumVideo" controls autoplay playsinline></video>';
  const video = $('#forumVideo');
  video.addEventListener('error', () => {
    $('#surface').insertAdjacentHTML('beforeend', '<div class="empty">Prehrávanie zlyhalo — stream mohol expirovať. Skús ho spustiť ešte raz.</div>');
  }, { once: true });
  if (!isHls) { video.src = src; return; }
  // Safari plays HLS natively; Chromium needs hls.js.
  if (video.canPlayType('application/vnd.apple.mpegurl')) { video.src = src; return; }
  if (!window.Hls || !Hls.isSupported()) {
    $('#surface').innerHTML = '<div class="empty">Tento prehliadač nepodporuje HLS prehrávanie.</div>';
    return;
  }
  forumHls = new Hls({ enableWorker: true });
  forumHls.loadSource(src);
  forumHls.attachMedia(video);
}

async function play(id) {
  const l = findLink(id);
  if (!l) return;
  $('#playerTitle').textContent = l.title;
  $('#playerSource').href = l.url;
  $('#surface').innerHTML = `<div class="empty"><span class="material-icons-round spin">refresh</span><br>Resolvujem stream…</div>`;
  $('#player').classList.add('visible');

  // A password-protected file has no stream the resolver may legitimately
  // obtain. Do not mark it dead after an inevitable failed probe.
  if (/password required/i.test(l.title || '')) {
    $('#surface').innerHTML = '<div class="empty">Tento súbor vyžaduje heslo na zdrojovej službe.<br>Otvor „Zdroj“, odomkni ho tam a potom prehratie skús znovu.</div>';
    return;
  }

  // Turbo & friends never expose a direct file — they only play inside their own
  // embed page. Resolving them for a stream URL is pointless; frame them instead.
  const embedSrc = embedUrlFor(l);
  if (embedSrc) {
    $('#surface').innerHTML = `<iframe src="${esc(embedSrc)}" allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen referrerpolicy="no-referrer"></iframe>`;
    return;
  }

  let link = l;
  if (!link.stream_url) {
    try {
      const res = await api('/api/forum/links/resolve', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ link_ids: [id] }),
      });
      link = res.results[0];
      Object.assign(l, link);
    } catch (e) {
      $('#surface').innerHTML = `<div class="empty">Resolve zlyhal: ${esc(e.message)}</div>`;
      return;
    }
  }

  if (link.status === 'dead' || !link.stream_url) {
    $('#surface').innerHTML = `<div class="empty">Priamy stream sa nepodarilo získať.<br>Otvor pôvodný zdroj.</div>`;
    replaceCard(id);
    return;
  }

  // bunkr's CDN answers direct <video> requests fine (no referer check, CORS *),
  // but pixeldrain/filester/fileditch/turbo hosts reject a browser hitting the
  // CDN with no referer (or the wrong one) — video_proxy re-fetches server-side
  // with the right Referer per host and streams the bytes through instead.
  const isHls = link.is_hls || /\.m3u8(?:[?#]|$)/i.test(link.stream_url);
  const needsProxy = !isHls && /pixeldrain\.com\/api\/|filester\.|fileditchfiles\.|turbo\.cr/i.test(link.stream_url);
  const src = needsProxy ? `/api/v1/video_proxy?url=${encodeURIComponent(link.stream_url)}` : link.stream_url;
  showVideo(src, isHls);
  replaceCard(id);
}

function closePlayer() {
  disposeForumHls();
  $('#player').classList.remove('visible');
  $('#surface').innerHTML = '';
}

async function importOne(id) { await doImport([id]); }

async function doImport(ids) {
  if (!ids.length) return;
  try {
    const res = await api('/api/forum/links/import', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ link_ids: ids }),
    });
    toast(`${res.imported} do fronty importu`);
    state.selected.clear();
    loadFeed();
  } catch (e) { toast(e.message, 'bad'); }
}

async function markSeen(tid) {
  try {
    await api(`/api/forum/threads/${tid}/seen`, { method: 'POST' });
    loadFeed();
  } catch (e) { toast(e.message, 'bad'); }
}

/* ── tags ──────────────────────────────────────────── */
function renderChips() {
  const wrap = $('#chips');
  wrap.querySelectorAll('.chip').forEach(c => c.remove());
  const input = wrap.querySelector('.tag-input-wrap');
  state.tags.forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${esc(t)}<button title="odobrať"><span class="material-icons-round" style="font-size:15px">close</span></button>`;
    chip.querySelector('button').onclick = () => {
      state.tags = state.tags.filter(x => x !== t);
      renderChips();
    };
    wrap.insertBefore(chip, input);
  });
}

let sugTimer;
$('#tagInput').addEventListener('input', e => {
  clearTimeout(sugTimer);
  const q = e.target.value.trim();
  sugTimer = setTimeout(async () => {
    if (!q) return $('#suggest').classList.remove('visible');
    const { tags } = await api(`/api/forum/tags?board=${state.board}&q=${encodeURIComponent(q)}&limit=12`);
    if (!tags.length) return $('#suggest').classList.remove('visible');
    $('#suggest').innerHTML = tags
      .map(t => `<div onclick="addTag('${esc(t.tag).replace(/'/g,"\\'")}')">${esc(t.tag)}<span>${Math.round(t.weight)}</span></div>`)
      .join('');
    $('#suggest').classList.add('visible');
  }, 160);
});
$('#tagInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) { addTag(e.target.value.trim()); e.preventDefault(); }
});
function addTag(tag) {
  tag = tag.toLowerCase();
  if (!state.tags.includes(tag)) state.tags.push(tag);
  $('#tagInput').value = '';
  $('#suggest').classList.remove('visible');
  renderChips();
}

async function loadChannels() {
  const { queries } = await api('/api/forum/queries');
  $('#channels').innerHTML = queries.map(q => `
    <span class="channel" onclick="runChannel(${q.id})">
      <span class="material-icons-round" style="font-size:14px">star</span>${esc(q.name)}
      <button onclick="event.stopPropagation();delChannel(${q.id})">
        <span class="material-icons-round" style="font-size:14px">close</span></button>
    </span>`).join('') || '<span class="thread-meta">Zatiaľ žiadne uložené kanály.</span>';
  window._channels = queries;
}
function runChannel(id) {
  const q = window._channels.find(x => x.id === id);
  state.tags = [...q.tags];
  $('#windowSel').value = String(q.window_days);
  $('#boardSel').value = q.board;
  state.board = q.board;
  renderChips();
  discover();
}
async function delChannel(id) {
  await api(`/api/forum/queries/${id}`, { method: 'DELETE' });
  loadChannels();
}

function summarizeForumRun(res) {
  const buckets = [...(res.watchlists || []), ...(res.saved_queries || []), res].filter(Boolean);
  const links = Number(res.new_links || 0);
  const skipped = buckets.reduce((n, x) => n + Number(x.threads_skipped || 0), 0);
  const errors = [];
  buckets.forEach(x => {
    if (x.error) errors.push(x.error);
    (x.errors || []).forEach(e => errors.push(e));
  });
  const limited = errors.some(e => /429|throttle/i.test(String(e)));
  let msg = `${links} nových liniek`;
  if (skipped) msg += `, ${skipped} threadov preskočených (čerstvé)`;
  if (limited) msg += ` — SimpCity spomalilo (429), zvyšok neskôr`;
  else if (errors.length) msg += ` — ${errors.length} chýb`;
  return { msg, kind: limited || errors.length ? 'bad' : 'ok', errors };
}

async function discover() {
  if (!state.tags.length) return toast('Pridaj aspoň jeden tag.', 'bad');
  pauseQueue();
  setBusy(true, '#discoverBtn');
  setActivity(`Hľadám thready s tagmi: ${state.tags.join(' + ')}…`);
  try {
    const res = await api('/api/forum/discover', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        board: state.board, tags: state.tags,
        window_days: +$('#windowSel').value,
        platforms: state.platform ? [state.platform] : [],
      }),
    });
    const sum = summarizeForumRun(res);
    toast(sum.msg, sum.kind);
    loadFeed();
  } catch (e) { toast(e.message, 'bad'); }
  finally { setBusy(false, '#discoverBtn'); setActivity(''); resumeQueue(); loadBoards(); }
}

/* ── refresh ───────────────────────────────────────── */
function setBusy(on, sel) {
  state.busy = on;
  const btn = $(sel);
  btn.disabled = on;
  const icon = btn.querySelector('.material-icons-round');
  icon.classList.toggle('spin', on);
}

async function refresh() {
  pauseQueue();
  setBusy(true, '#refreshBtn');
  setActivity('Sťahujem nové posty zo sledovaných threadov (po jednom, bez 429)…');
  try {
    const job = await api('/api/forum/refresh/jobs', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ boards: [state.board] }),
    });
    let status;
    do {
      await new Promise(resolve => setTimeout(resolve, 1000));
      status = await api(`/api/forum/refresh/jobs/${encodeURIComponent(job.job_id)}`);
      setActivity(status.progress && status.progress.message
        ? status.progress.message
        : 'Synchronizujem fórum…');
    } while (status.status === 'queued' || status.status === 'running');
    if (status.status !== 'completed') throw new Error(status.error || 'Synchronizácia zlyhala.');
    const sum = summarizeForumRun(status.result || {});
    toast(sum.msg, sum.kind);
    loadFeed();
  } catch (e) { toast(e.message, 'bad'); }
  finally { setBusy(false, '#refreshBtn'); setActivity(''); resumeQueue(); loadBoards(); }
}

/* ── wiring ────────────────────────────────────────── */
$('#modeSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  state.mode = btn.dataset.mode;
  [...$('#modeSeg').children].forEach(b => b.classList.toggle('active', b === btn));
  $('#tagbar').classList.toggle('visible', state.mode === 'tag');
  loadFeed();
});
$('#boardSel').onchange = e => { state.board = e.target.value; checkAuth(); loadFeed(); };
$('#statusSel').onchange = e => { state.status = e.target.value; loadFeed(); };
$('#platformSel').onchange = e => { state.platform = e.target.value; loadFeed(); };
$('#sortSel').onchange = e => { state.sort = e.target.value; loadFeed(); };
$('#qualitySel').onchange = e => { state.minHeight = +e.target.value; loadFeed(); };
$('#sizeSel').onchange = e => { state.minSizeMb = +e.target.value; loadFeed(); };
$('#durationSel').onchange = e => { state.minDuration = +e.target.value; loadFeed(); };
$('#completeChk').onchange = e => { state.onlyComplete = e.target.checked; loadFeed(); };

let searchTimer;
$('#searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = e.target.value.trim(); loadFeed(); }, 260);
});

$('#refreshBtn').onclick = refresh;
$('#discoverBtn').onclick = discover;
$('#collapseAll').onclick = () => {
  const allCollapsed = state.threads.length && state.threads.every(t => state.collapsed.has(t.id));
  setAllCollapsed(!allCollapsed);
  $('#collapseAll').querySelector('.material-icons-round').textContent =
    allCollapsed ? 'unfold_less' : 'unfold_more';
};
$('#saveBtn').onclick = async () => {
  if (!state.tags.length) return toast('Pridaj aspoň jeden tag.', 'bad');
  await api('/api/forum/queries', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      name: state.tags.join(' + '), board: state.board,
      tags: state.tags, window_days: +$('#windowSel').value,
    }),
  });
  toast('Kanál uložený — refresh ho odteraz kontroluje.');
  loadChannels();
};

$('#importSel').onclick = () => doImport([...state.selected]);
$('#clearSel').onclick = () => { state.selected.clear(); syncSelection(); };
$('#selAllBtn').onclick = () => {
  const links = visibleLinks();
  const allOn = links.length && links.every(l => state.selected.has(l.id));
  if (allOn) state.selected.clear();
  else links.forEach(l => state.selected.add(l.id));
  syncSelection();
};
$('#selDeadBtn').onclick = () => selectWhere(l => l.status === 'dead');
$('#selPendingBtn').onclick = () => selectWhere(l => l.status === 'new' && !l.resolved);
$('#selOkBtn').onclick = () => selectWhere(l => l.resolved);
$('#purgeDeadBtn').onclick = () => purgeStatus('dead');
$('#resolveSel').onclick = async () => {
  setBusy(true, '#resolveSel');
  try {
    await api('/api/forum/links/resolve', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ link_ids: [...state.selected] }),
    });
    toast('Overené');
    loadFeed();
  } catch (e) { toast(e.message, 'bad'); }
  finally { setBusy(false, '#resolveSel'); }
};
async function bulkAction(path, verb) {
  const ids = [...state.selected];
  if (!ids.length) return toast('Nič nie je vybrané.', 'bad');
  try {
    const res = await api(path, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ link_ids: ids }),
    });
    toast(`${res.dismissed ?? res.deleted ?? ids.length} ${verb}`);
    state.selected.clear();
    loadFeed();
  } catch (e) { toast(e.message, 'bad'); }
}

$('#dismissSel').onclick = () => bulkAction('/api/forum/links/dismiss', 'skrytých');
$('#deleteSel').onclick = () => {
  if (!confirm(`Naozaj vymazať ${state.selected.size} liniek? Refresh ich už nevráti.`)) return;
  bulkAction('/api/forum/links/delete', 'vymazaných');
};

$('#playerClose').onclick = closePlayer;
$('#player').onclick = e => { if (e.target.id === 'player') closePlayer(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePlayer(); $('#suggest').classList.remove('visible'); state.selected.clear(); syncSelection(); }
  if (e.key === 'r' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); refresh(); }
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === 'a' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $('#selAllBtn').click(); }
  if (e.key === 'm') { e.preventDefault(); $('#selDeadBtn').click(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && state.selected.size) {
    e.preventDefault();
    $('#deleteSel').click();
  }
});

(async () => {
  state.collapsed = loadCollapsed();
  await loadBoards();
  await loadChannels();
  await loadFeed();
})();
</script>
